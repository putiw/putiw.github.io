<title>Shrimp Home Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/*CSS*/
</style>
<header class="top" id="top">
  <div class="row brand">
    <span class="date" id="b-date">Day 0</span>
    <span class="devtag">dev prototype</span>
    <button class="btn hbtn" id="tb-mute" type="button" aria-pressed="false" aria-label="Sound"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3.5v11L6 12H3z"/><path class="mute-on" d="M13 7.5c1 .8 1.5 1.6 1.5 2.5s-.5 1.7-1.5 2.5M15 5.5c1.6 1.3 2.5 2.8 2.5 4.5s-.9 3.2-2.5 4.5"/><path class="mute-off" d="M13 7.5l5 5M18 7.5l-5 5"/></svg></button>
    <button class="btn hbtn" id="tb-info" type="button" aria-label="What is this">?</button>
  </div>
  <div class="row r1">
    <div class="cash"><span id="b-money" class="mono">AED 0</span><small id="b-sub"></small></div>
    <div class="speed" role="group" aria-label="Game speed" id="speed">
      <button data-speed="0" aria-label="Pause">❚❚</button><button data-speed="1">1×</button><button data-speed="4">4×</button><button data-speed="20">20×</button>
    </div>
  </div>
</header>
<main class="wrap" id="main">
  <section class="panel" id="p-home"></section>
  <section class="panel" id="p-tank" hidden></section>
  <section class="panel" id="p-book" hidden></section>
  <section class="panel" id="p-try" hidden></section>
</main>
<div class="toast" id="toast" hidden></div>
<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheet-in"></div></div>
<div class="apop-dim" id="pop-dim" hidden></div>
<div class="apop" id="pop" hidden></div>
<nav class="tabs" role="tablist" aria-label="Sections"><div class="tabs-in">
  <button role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 9.5 10 4l6.5 5.5"/><path d="M5.5 8v8h9V8"/><path d="M8.5 16v-4h3v4"/></svg><span>Home</span></button>
  <button role="tab" data-tab="tank" aria-selected="false"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="5" width="14" height="11" rx="1.5"/><path d="M3 9.5c2.3-1.4 4.7 1.4 7 0s4.7-1.4 7 0"/></svg><span>Tank</span><i class="dot" id="tankdot" hidden></i></button>
  <button role="tab" data-tab="book" aria-selected="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4.5h4.5a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 0-1.5-1.5H4z"/><path d="M16 4.5h-4.5A1.5 1.5 0 0 0 10 6v10a1.5 1.5 0 0 1 1.5-1.5H16z"/></svg><span>Book</span></button>
  <button role="tab" data-tab="try" aria-selected="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4h10v12H5z"/><path d="M7.5 8l1.2 1.2L11 7M7.5 12.5l1.2 1.2L11 11.5M12.5 8.2h1M12.5 12.7h1"/></svg><span>Try</span></button>
</div></nav>
