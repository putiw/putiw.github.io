<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Shrimp Home Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Same field notebook as the game: cream paper, dark ink, forest-green actions, cherry red for shrimp.
   Light only, on purpose (Puti's rule). Every colour is a token on :root. */
:root{
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#efe9dc; --surface:#fbf8f1; --surface-2:#f2ecdf; --ink:#22201b; --ink-2:#524c3d; --ink-3:#716a57;
  --line:#dcd2be; --accent:#2d6a4f; --accent-ink:#ffffff; --shrimp:#bf3a2b; --off:#e4ddcf; --off-ink:#8a8270;
  --zone-ok:#cfe0cc; --zone-warn:#efdcaa; --zone-bad:#efc3b9;
  --good:#2f7a45; --warn:#93560f; --bad:#b23a2e; --plum:#6b4f8a; --water:#a9d1d3; --dim:rgba(34,32,27,.45);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--font-body);font-variant-numeric:tabular-nums;margin:0;
  padding-block:0 84px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--font-body)}
h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
h3{font-size:13.5px;font-weight:600}
p{margin:0}
small,.muted{color:var(--ink-3)}
.mono{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:6px 0 6px;margin:0 auto;max-width:760px}
.brand{gap:8px;padding:2px 0}
.date{flex:1;min-width:0;font:400 11.5px var(--font-body);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.devtag{font:700 10px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--plum);border:1px solid color-mix(in srgb,var(--plum) 45%,transparent);border-radius:999px;padding:4px 7px;white-space:nowrap}
.hbtn{width:34px;height:30px;min-height:30px!important;padding:0!important;border-radius:7px!important;display:flex;align-items:center;justify-content:center;font-size:15px!important}
.hbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.hbtn svg path:first-child{fill:currentColor}
#tb-mute .mute-off{display:none}#tb-mute.muted .mute-off{display:inline}#tb-mute.muted .mute-on{display:none}
.r1{flex-wrap:nowrap;margin-top:2px}
.cash{display:flex;flex-direction:column;line-height:1.1;min-width:0}
#b-money{font:700 19px var(--font-body);letter-spacing:-.01em}
#b-sub{font:500 11.5px var(--font-body);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speed{display:flex;gap:5px;flex:0 0 auto}
.speed button{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:2px 6px;font:500 11.5px var(--font-body);min-height:32px;min-width:34px;cursor:pointer}
.speed button::after{content:'';position:absolute;inset:-7px -2px}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.speed button:disabled{opacity:.32;cursor:not-allowed}

/* cards and buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-height:22px;margin-bottom:4px}
.hd h2{flex:0 0 auto;white-space:nowrap}
.hd>small{min-width:0;flex:1 1 auto;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.sub{color:var(--ink-2);font-size:13.5px;line-height:1.45}
.hint{font-size:12.5px;line-height:1.4;color:var(--ink-2);margin:3px 0 0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 12px;font-weight:600;font-size:13.5px;min-height:42px;cursor:pointer;position:relative;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn:disabled,.btn.primary:disabled{background:var(--off);color:var(--off-ink);border-color:transparent;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.97)}
.btn small{display:block;font-weight:400;color:inherit;opacity:.8;font-size:11.5px}
.btn.sm{min-height:32px;padding:4px 10px;font-size:12.5px}
.btn.glow{animation:glow 1.6s ease-in-out infinite;outline:2px solid var(--accent);outline-offset:-5px}
.btn.primary.glow{outline-color:color-mix(in srgb,var(--accent-ink) 85%,transparent)}
@keyframes glow{0%,100%{filter:none}50%{filter:brightness(1.13) saturate(1.1)}}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px;font:600 12px var(--font-body);color:var(--ink-2);white-space:nowrap}
.chip.warn{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--zone-warn) 45%,var(--surface))}
.chip.bad{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--zone-bad) 45%,var(--surface))}
.chip.ok{border-color:color-mix(in srgb,var(--good) 50%,var(--line));color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex;gap:6px}.seg .btn{flex:1;min-width:0}
.seg .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h3.track{margin:12px 0 4px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.kv span{color:var(--ink-3)}.kv b{font-weight:600}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:5px max(10px,env(safe-area-inset-right,0px)) calc(5px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs-in{display:flex;gap:4px;width:100%;max-width:760px;margin:0 auto}
.tabs button{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;border-radius:9px;padding:5px 2px;font:600 12px var(--font-body);color:var(--ink-2);min-height:50px;cursor:pointer}
.tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--shrimp);border:2px solid var(--surface)}

/* toast, sheet, popover */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--surface);font:500 13px/1.35 var(--font-body);padding:9px 14px;border-radius:10px;max-width:calc(100vw - 32px);width:max-content;box-shadow:0 6px 18px rgba(0,0,0,.2);pointer-events:none}
body.sheet-on .toast,body.on-home .toast{top:calc(env(safe-area-inset-top,0px) + 12px);bottom:auto}
.sheet{position:fixed;inset:0;z-index:60;background:var(--dim);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));box-shadow:0 -6px 24px rgba(0,0,0,.18);max-height:92vh;overflow:auto;overscroll-behavior:contain}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.sheet-hd h2{font-size:17px}
.apop-dim{position:fixed;inset:0;z-index:30;background:var(--dim)}
.apop{position:fixed;left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 16px));top:calc(env(safe-area-inset-top,0px) + 64px);z-index:31;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--ink);border-radius:12px;padding:10px 12px 12px;box-shadow:0 14px 34px rgba(0,0,0,.28);max-height:70vh;overflow:auto}
.apop p{margin:0 0 8px;font-size:13.5px;line-height:1.45;color:var(--ink-2)}

/* the tank view (same look as the game) */
.tv{position:relative;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:var(--water);margin-bottom:8px;aspect-ratio:1.75/1;width:100%;max-width:100%}
.tv canvas{display:block;width:100%;height:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tv-cap{position:absolute;left:8px;bottom:6px;font:500 11px var(--font-body);background:rgba(251,248,241,.88);color:var(--ink-2);padding:2px 8px;border-radius:999px;pointer-events:none;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv.locked{box-shadow:0 0 0 3px var(--accent)}.tv.locked canvas{touch-action:none}.tv.locked .tv-cap{display:none}
body.locked{overflow:hidden;overscroll-behavior:none}
.lockdim{position:fixed;inset:0;z-index:40;background:var(--dim)}
body.locked .lockzone{position:relative;z-index:41}
body.locked .tabs{z-index:42}
.lockbar{display:flex;gap:8px;align-items:center;background:var(--surface);border-radius:10px;padding:6px 8px;margin:0 0 8px}
.netbar{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin:-2px 0 8px}
.netbar[hidden]{display:none}.netbar .nb-n{font:500 12.5px/1.3 var(--font-body);color:var(--ink-2);white-space:nowrap}.netbar .nb-n b{font-weight:600;color:var(--ink)}
.netbar .nb-b{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.lockbar span{flex:1;min-width:0;font:500 12.5px/1.3 var(--font-body);color:var(--ink-2)}
.lockbar .btn{min-height:36px;padding:4px 14px}
.tchips{display:flex;gap:6px;overflow-x:auto;padding:0 0 6px;margin-bottom:2px;scrollbar-width:none}.tchips::-webkit-scrollbar{display:none}
.tchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:2px 10px;font:600 12px var(--font-body);min-height:30px;cursor:pointer;display:flex;gap:6px;align-items:center;color:var(--ink)}
.tchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.toys .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:6px 4px;font-size:12.5px;line-height:1.15;text-align:center}
.toys .btn canvas{width:28px;height:22px}
.toys .btn small{font-size:10.5px;font-weight:500;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.toys .btn.need small{color:var(--warn);opacity:1}
.toys .btn.glow.need small{color:inherit}
.palette{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.palette::-webkit-scrollbar{display:none}
.palette button{flex:0 0 auto;width:70px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:500 11px/1.15 var(--font-body);color:var(--ink-2)}
.palette button canvas{width:56px;height:36px}
.palette button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}

/* colony list */
.colony{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.cl{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:var(--surface);min-width:0}
.cl canvas{width:44px;height:22px;flex:0 0 auto}
.cl div{min-width:0}.cl b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cl small{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* shrimp detail bubble */
.bub{position:absolute;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:0 8px 20px rgba(0,0,0,.18);width:min(250px,calc(100% - 12px));font-size:12.5px;line-height:1.35}
.bub b{font-size:13px}.bub .btns{margin-top:6px;gap:6px}.bub .btn{min-height:30px;padding:3px 9px;font-size:12px}
.bub .gene{font-size:11px;color:var(--plum);margin-top:3px}
.genome{font:9.5px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;letter-spacing:.3px;color:var(--ink);margin:2px 0 3px}
.genome .gs{padding:0 1px;border-radius:2px}.genome .gs0{background:rgba(220,139,121,.22)}.genome .gs36{background:rgba(68,107,125,.16)}.genome .gs52{background:rgba(248,216,117,.45)}.genome .gs56{background:rgba(74,166,62,.16)}.genome .gs64{background:rgba(191,188,175,.35)}
.wheelrow{display:flex;gap:12px;align-items:flex-start}.wheelrow canvas{flex:0 0 auto}.wheeltxt{min-width:0;font-size:12.5px;line-height:1.4}.wheeltxt p{margin:0 0 6px}
.wheeltxt details{border-top:1px solid var(--line);padding-top:6px}.wheeltxt summary{cursor:pointer;font-weight:600;font-size:12.5px;margin-bottom:4px}

/* sort tray and cups */
.sortcv{display:block;width:100%;border-radius:10px;border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;background:#f6f3ec}

/* book */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.bent{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:6px;text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.bent canvas{width:100%;max-width:90px;height:48px}
.bent b{font-size:11.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bent small{font-size:10.5px;line-height:1.2}
.bent.no{border-style:dashed;background:transparent}.bent.no b{color:var(--ink-3)}
.bprog{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:2px 0 8px}.bprog i{display:block;height:100%;background:var(--accent)}

/* try tab */
.prop{border-top:1px solid var(--line);padding:10px 0}.prop:first-of-type{border-top:0}
.prop h3{font-size:14px}.prop p{font-size:12.5px;color:var(--ink-2);margin:2px 0 6px;line-height:1.4}
.prop .seg .btn{min-height:34px;font-size:12.5px;padding:4px 6px}.prop .seg .btn.nb{flex:0 0 auto;padding:4px 12px;color:var(--ink-2)}
.prop .seg .btn.k[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.prop .seg .btn.m[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.prop .seg .btn.d[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.prop textarea{width:100%;min-height:52px;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:7px 9px;font:13px/1.4 var(--font-body);color:var(--ink);resize:vertical}
.prop .tryb{float:right;margin:-2px 0 0 8px}
#p-try h3.track{margin:14px 0 0}#p-try h3.track+.prop{border-top:0}
.savest{font-size:11.5px;color:var(--ink-3)}
.report{border-left:3px solid var(--accent);background:var(--surface-2);border-radius:8px;padding:8px 11px;margin:0 0 8px;font-size:13px;line-height:1.4}
.report b{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}

/* home */
.landwrap{position:relative;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#e9e2d1;touch-action:none}
.landwrap canvas{display:block;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.ltools{display:flex;gap:6px;margin:8px 0}
.ltools .btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:50px;padding:4px 2px;font-size:11.5px}
.ltools .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ltools .btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.btn.glow{animation:none}}
@media (max-width:374px){#b-money{font-size:17px}.speed{gap:3px}.speed button{min-width:30px;padding:2px 4px}.devtag{display:none}}


.wbar{position:relative;height:8px;border-radius:99px;background:var(--line);margin:2px 0 8px;overflow:visible}.wbar i{display:block;height:100%;border-radius:99px}.wbar b{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink-2);border-radius:1px}

/* collapsible cards and ? help, the same as the game's */
.coll>.hd{cursor:pointer;user-select:none;margin-bottom:0}
.coll>.hd h2::before{content:'▾';display:inline-block;width:16px;color:var(--ink-3);transition:transform .15s}
.coll.shut>.hd h2::before{transform:rotate(-90deg)}
.coll:not(.shut)>.hd{margin-bottom:6px}
.coll.shut>:not(.hd){display:none!important}
.qhelp{flex:0 0 auto;width:26px;height:26px;margin-left:6px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font:700 13px/1 var(--font-body);cursor:pointer;padding:0;align-self:center}
.qhelp[aria-expanded="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.helpbox{margin:6px 0 4px;padding:9px 11px;border-radius:9px;background:var(--surface-2);font-size:13px;line-height:1.45;color:var(--ink-2)}.helpbox p{margin:6px 0 0}
.wbar{height:6px}.wbar b{top:-4px;height:14px}
.coll>.hd{align-items:center}.coll>.hd small{margin-left:auto;text-align:right}
.bent b{white-space:normal;line-height:1.2;overflow:visible;text-overflow:clip}

.tv.fadein{animation:tvIn .28s ease-out}@keyframes tvIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.tv.fadein{animation:none}}

/* ---- Home tab (land.js) ---- */
.hcard{margin-bottom:8px}
.hcard .hd{align-items:center;margin-bottom:0}
.hcard .qh{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font:700 13px/1 var(--font-body);cursor:pointer;padding:0}
.hmove{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.hmove span{min-width:0;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmove .btn{flex:0 0 auto}
.lstat{display:flex;align-items:center;gap:8px;min-height:32px;font-size:12.5px;line-height:1.3;color:var(--ink-2);flex-wrap:nowrap;overflow:hidden}
.lstat span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lstat .btn{flex:0 0 auto;white-space:nowrap}
.lstat span{flex:1 1 auto;min-width:0}
.lstat .btn{min-height:30px;padding:3px 10px;font-size:12px}
.ltools{margin:8px 0 6px}
.lpal{margin-bottom:2px}
.lpal button{width:76px}
.lpal button .pi{display:block;height:36px}
.lpal button b{font-size:11px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lpal button small{font-size:10.5px}
.lbub{min-width:150px}
.lbub .hint{margin-top:4px}
.trapcv,.fishcv{display:block;border-radius:10px;border:1px solid var(--line);margin:0 auto 8px;max-width:100%}
.trap-catch{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:4px 0 2px}
.tc{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);border-radius:9px;padding:4px 2px;background:var(--surface-2);min-width:0}
.tc small{font-size:10.5px;line-height:1.2;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tc.find{background:var(--surface)}
.landwrap canvas{-webkit-touch-callout:none}
/* pixel home */
.landwrap.pixland{background:#efe9dc}
.landwrap.pixland canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.llbl{position:absolute;z-index:4;transform:translate(-50%,-100%);background:#fbf8f1;border:1px solid #21181b;border-radius:6px;padding:1px 7px;font:600 11px/1.4 var(--font-body);color:#21181b;pointer-events:none;white-space:nowrap;animation:llbl 2.2s ease-out forwards}
@keyframes llbl{0%{opacity:0;margin-top:0}10%{opacity:1}80%{opacity:1}100%{opacity:0;margin-top:-10px}}
/* wrap rather than cut off (the game never truncates) */
.hcard .hd>small{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3}
.hmove span{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3}
.lpal button b{white-space:normal;line-height:1.15;overflow:visible;text-overflow:clip}
.lstat span{white-space:normal;overflow:visible;text-overflow:clip}

/* ---- core.js ---- */
'use strict';
// ===== Core: state, clock, money, book, tabs, toasts, sheets =====
var BUILD='proto-2026-10-26b';
var $=function(id){return document.getElementById(id);};
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function gauss(){var u=1-Math.random(),v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(x,y,s){var h=(x|0)*374761393+(y|0)*668265263+((s|0)+1)*1442695041;h=(h^(h>>>13))*1274126177;h=h^(h>>>16);return (h>>>0)/4294967296;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtN(n){n=Math.round(n);return n.toLocaleString('en-US');}
function fmtA(n){var a=Math.abs(n),s=n<0?'−':'';if(a>=999.5e6)return s+'AED '+(a/1e9).toFixed(a>=1e10?0:1).replace(/\.0$/,'')+'B';if(a>=999500)return s+'AED '+(a/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+'M';if(a>=1e5)return s+'AED '+Math.round(a/1e3)+'k';return s+'AED '+fmtN(a);}
function plural(n,w,ws){return n+' '+(n===1?w:(ws||w+'s'));}

var DAY_SEC=20;            // real seconds per game day at 1x
var SEASONS=['spring','summer','autumn','winter'];
function seasonOf(day){return SEASONS[Math.floor(((day%360)+360)%360/90)];}

// ----- state -----
var S=null,SAVE_KEY='shrimp-proto-v1';
var STAGES=[
 {id:'flat',name:'Grandma’s flat',tanks:2,cost:0},
 {id:'balcony',name:'A flat with a balcony',tanks:3,cost:4000},
 {id:'house',name:'A house with a garden',tanks:5,cost:40000},
 {id:'land',name:'Land with a stream',tanks:6,cost:250000}];
function newState(){return {v:1,build:BUILD,day:0,lastDay:0,speed:1,cash:3000,stage:0,
  opt:{toys:'need',effects:'score',company:'running',genes:false,sound:true},
  tanks:[],sel:0,book:{shrimp:{},birds:{},fish:{},finds:{}},land:{},company:{week:0,last:null,reports:[]},
  stats:{earned:0,spent:0},nextId:1,tab:'try',seen:{}};}
var saveT=0;
function save(now){if(!S)return;if(!now){if(saveT)return;saveT=setTimeout(function(){saveT=0;save(true);},1500);return;}
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function load(){try{var t=localStorage.getItem(SAVE_KEY);if(t){var s=JSON.parse(t);if(s&&s.v===1)return s;}}catch(e){}return null;}
function uid(){return S.nextId++;}

// ----- modules -----
var MODS=[];               // {name, init(), day(d), tick(dtDays,dtSec), show(), hide(), render()}
function registerMod(m){MODS.push(m);}
function modCall(fn){var a=Array.prototype.slice.call(arguments,1);MODS.forEach(function(m){if(m[fn])try{m[fn].apply(m,a);}catch(e){console.error(m.name,fn,e);}});}
var TABMOD={};             // tab name -> module that owns it
function registerTab(tab,m){TABMOD[tab]=m;}

// ----- clock -----
var LOCK=0;                // >0 while a toy, sheet or mini game holds time still
function hold(){LOCK++;updateHeader();}
function release(){LOCK=Math.max(0,LOCK-1);updateHeader();}
function running(){return S.speed>0&&LOCK===0;}
var lastTs=0;
function loop(ts){var dtSec=lastTs?Math.min(0.1,(ts-lastTs)/1000):0.016;lastTs=ts;
  var dd=0;if(running()){dd=dtSec*S.speed/DAY_SEC;advance(dd);}
  modCall('tick',dd,dtSec);
  if((loop.n=(loop.n||0)+1)%15===0)updateHeader();
  requestAnimationFrame(loop);}
function advance(dd){S.day+=dd;var guard=0;while(Math.floor(S.day)>S.lastDay&&guard++<400){S.lastDay++;dayRoll(S.lastDay);}}
function dayRoll(d){modCall('day',d);save();}
function skipDays(n){for(var i=0;i<n;i++){S.day=Math.floor(S.day)+1;S.lastDay=Math.floor(S.day);dayRoll(S.lastDay);}modCall('render');updateHeader();}
function setSpeed(v){if(activeTab==='home'&&v>1){toast('At home time runs at 1×.');sfx('nope');v=1;}S.speed=v;document.querySelectorAll('#speed button').forEach(function(b){b.setAttribute('aria-pressed',String(+b.dataset.speed===v));});speedLock();updateHeader();save();}
// Puti: at home it's always 1×, no speed-ups. Leaving home gives back the speed you had.
function speedLock(){var home=activeTab==='home';document.querySelectorAll('#speed button').forEach(function(b){b.hidden=home&&+b.dataset.speed>1;});}
function homeSpeed(){if(activeTab==='home'){if(S.speed>1){S.speedAway=S.speed;setSpeed(1);}}else if(S.speedAway){var v=S.speedAway;S.speedAway=0;setSpeed(v);}speedLock();}

// ----- money -----
function spend(n,what){if(n<=0)return true;if(S.cash<n){toast('Not enough cash for '+what+'. Add some under Try › Dev.');sfx('nope');return false;}S.cash-=n;S.stats.spent+=n;updateHeader();save();return true;}
function earn(n,what){if(n<=0)return;S.cash+=n;S.stats.earned+=n;updateHeader();save();}

// ----- book -----
var BOOK={};               // cat -> {title, entries:[{id,name,draw(ctx,w,h),hint}]}
function bookCat(cat,def){BOOK[cat]=def;}
function bookHas(cat,id){return !!(S.book[cat]&&S.book[cat][id]);}
function bookAdd(cat,id,info){if(!S.book[cat])S.book[cat]={};if(S.book[cat][id])return false;var e={day:Math.floor(S.day)};for(var k in info||{})e[k]=info[k];S.book[cat][id]=e;
  var def=BOOK[cat],ent=def&&def.entries.find(function(x){return x.id===id;});bookNews(ent?ent.name:id);save();modCall('bookChanged',cat,id);return true;}
// several finds at once (a trap full of shrimp) make one message, not a queue of them
var BOOKQ=[],BOOKT=0;
function bookNews(n){BOOKQ.push(n);if(BOOKT)return;BOOKT=setTimeout(function(){var q=BOOKQ.splice(0);BOOKT=0;var t=q.length===1?q[0]:q.length===2?q[0]+' and '+q[1]:q.slice(0,-1).join(', ')+' and '+q[q.length-1];toast('New in the book: '+t,q.length>2?3600:2600);sfx('book');},350);}

// ----- header -----
function updateHeader(){if(!S)return;var d=Math.floor(S.day);$('b-date').textContent='Day '+d+' · '+seasonOf(d);
  $('b-money').textContent=fmtA(S.cash);
  var sub=LOCK?'Time stops while you work':S.speed===0?'Paused':'';if(!sub&&S.opt.company==='running'&&S.company.last)sub='Your share last week +'+fmtA(S.company.last.share);
  if(!sub&&S.opt.company==='sold')sub='Company sold · retired';
  $('b-sub').textContent=sub;}

// ----- toasts, sheets, popover -----
var toastQ=[],toastOn=false;
function toast(msg,ms){toastQ.push([msg,ms||2600]);if(!toastOn)toastNext();}
function toastNext(){var t=toastQ.shift();if(!t){toastOn=false;$('toast').hidden=true;return;}toastOn=true;var el=$('toast');el.textContent=t[0];el.hidden=false;setTimeout(toastNext,t[1]);}
var SHEET=null;
// openSheet({title, html, mount(el,api), onClose, keepTime}) -> api {el, close()}
function openSheet(o){closeSheet(true);var box=$('sheet-in');box.innerHTML='<div class="sheet-hd"><h2>'+esc(o.title||'')+'</h2>'+(o.noClose?'':'<button class="btn sm" data-x>Close</button>')+'</div><div class="sheet-body"></div>';
  var body=box.querySelector('.sheet-body');if(o.html)body.innerHTML=o.html;var api={el:body,close:function(){closeSheet();}};SHEET={o:o,api:api,at:performance.now()};
  var x=box.querySelector('[data-x]');if(x)x.onclick=function(){closeSheet();};$('sheet').hidden=false;document.body.classList.add('sheet-on');if(!o.keepTime)hold();
  if(o.mount)o.mount(body,api);return api;}
function closeSheet(silent){if(!SHEET)return;var s=SHEET;SHEET=null;$('sheet').hidden=true;document.body.classList.remove('sheet-on');$('sheet-in').innerHTML='';if(!s.o.keepTime)release();if(s.o.onClose)try{s.o.onClose();}catch(e){console.error(e);}if(!silent)modCall('render');}
var POP_AT=0;function openPop(html){$('pop').innerHTML=html;$('pop').hidden=false;$('pop-dim').hidden=false;POP_AT=performance.now();}
function closePop(){$('pop').hidden=true;$('pop-dim').hidden=true;}

// ----- tabs -----
var activeTab='home';
function setTab(t,arg){if(!TABMOD[t])t='home';if(t!==activeTab)toastQ.length=0;document.body.classList.toggle('on-home',t==='home');if(activeTab!==t&&TABMOD[activeTab]&&TABMOD[activeTab].hide)TABMOD[activeTab].hide();activeTab=t;S.tab=t;
  document.querySelectorAll('.tabs [data-tab]').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.tab===t));});
  ['home','tank','book','try'].forEach(function(n){$('p-'+n).hidden=n!==t;});homeSpeed();
  if(TABMOD[t].show)TABMOD[t].show(arg);window.scrollTo(0,0);sfxAmbient();save();}
function goTank(i){if(i!=null&&S.tanks[i])S.sel=i;setTab('tank');}

// ----- small canvas helper -----
function fitCanvas(cv,w,h){var d=Math.min(2,window.devicePixelRatio||1);if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d);}var x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);return x;}
function miniCanvas(w,h,draw){var c=document.createElement('canvas');var x=fitCanvas(c,w,h);c.style.width=w+'px';c.style.height=h+'px';draw(x,w,h);return c;}

// ----- boot -----
function boot(data){S=(data&&data.S)||load()||newState();var fresh=!S.tanks.length;
  if(S.build!==BUILD)S.build=BUILD;
  S.seen=S.seen||{};var topped=false;if(!S.seen.cash1m){S.seen.cash1m=1;if(S.cash<1e6){S.cash+=1e6;topped=!fresh;}}if(fresh)S.cash=Math.max(S.cash,1e6);
  modCall('init',fresh);
  document.querySelectorAll('#speed button').forEach(function(b){b.onclick=function(){setSpeed(+b.dataset.speed);sfx('click');};});
  document.querySelectorAll('.tabs [data-tab]').forEach(function(b){b.onclick=function(){sfx('click');setTab(b.dataset.tab);};});
  $('sheet').addEventListener('click',function(e){if(e.target===this&&SHEET&&!SHEET.o.noClose&&performance.now()-SHEET.at>450)closeSheet();});
  $('pop-dim').onclick=function(){if(performance.now()-POP_AT>450)closePop();};
  $('tb-info').onclick=function(){openPop('<div class="sheet-hd"><h2>What this is</h2><button class="btn sm" onclick="closePop()">Close</button></div><p>A test bench for ideas, separate from the game. Nothing here touches your real save.</p><p><b>Home</b> is the place that grows with you: Grandma’s flat, a balcony, a house with a garden, then land with a stream.</p><p><b>Tank</b> has the hands-on jobs (vacuum, sponge, trim, pests, aquascape), the net and colour breeding. Tap a shrimp to net it, hold one to look closer.</p><p><b>Book</b> collects every colour, bird, fish and stream find.</p><p><b>Try</b> lists each idea with Keep, Maybe or Drop and a note. Dev controls are at the bottom (jump ahead, add money, switch designs).</p><p>One game day is 20 seconds at 1×.</p>');};
  $('tb-mute').onclick=function(){S.opt.sound=!S.opt.sound;sfxUnlock();sfxMute(!S.opt.sound);save();};
  $('tb-mute').classList.toggle('muted',!S.opt.sound);
  setSpeed(S.speed);setTab(S.tab||'try');updateHeader();if(topped)toast('Added AED 1M of test money. More under Try › Dev.',3800);if(!S.seen.hello){S.seen.hello=1;toast('Every idea is listed here with a Try it button. Your notes save as you go.',4200);}
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return {S:S};});
  window.addEventListener('pagehide',function(){save(true);});
  document.addEventListener('visibilitychange',function(){if(document.hidden)save(true);sfxAmbient();});
  requestAnimationFrame(loop);}
function start(){var h=window.claude&&window.claude.hot;if(h&&h.ready)h.ready(boot);else boot((h&&h.data)||{});}

/* ---- ink.js ---- */
// ===== Ink: hand-drawn lines and watercolour washes, to sit next to the tank art =====
var INK='#2c2823';
function hexRGB(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c;}).join('');var n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];}
function rgbHex(r){return '#'+r.map(function(v){v=clamp(Math.round(v),0,255);return (v<16?'0':'')+v.toString(16);}).join('');}
function mixC(a,b,t){var A=hexRGB(a),B=hexRGB(b);return rgbHex([lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t)]);}
function shadeC(c,k){return k>=0?mixC(c,'#ffffff',k):mixC(c,'#1b1712',-k);}
function rgba(c,a){var r=hexRGB(c);return 'rgba('+r[0]+','+r[1]+','+r[2]+','+a+')';}
// Resample a polyline and push each point sideways by a smooth seeded wobble.
function wobble(pts,seed,amp,closed){var r=mulberry32((seed|0)+7),p1=r()*6.28,p2=r()*6.28,f1=0.07+r()*0.05,f2=0.19+r()*0.08,out=[],acc=0;
  var P=closed?pts.concat([pts[0]]):pts;
  for(var i=0;i<P.length-1;i++){var a=P[i],b=P[i+1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,n=Math.max(1,Math.ceil(L/5)),nx=-dy/L,ny=dx/L;
    for(var j=0;j<n;j++){var t=j/n,s=acc+L*t,o=amp*(Math.sin(s*f1+p1)*0.65+Math.sin(s*f2+p2)*0.35);out.push([a[0]+dx*t+nx*o,a[1]+dy*t+ny*o]);}acc+=L;}
  if(!closed){var e=P[P.length-1];out.push([e[0],e[1]]);}return out;}
function tracePts(x,pts,closed){x.beginPath();pts.forEach(function(p,i){if(i)x.lineTo(p[0],p[1]);else x.moveTo(p[0],p[1]);});if(closed)x.closePath();}
// inkPath(ctx, pts, {closed, w, col, seed, amp, fill, alpha, nostroke})
function inkPath(x,pts,o){o=o||{};var w=wobble(pts,o.seed||1,o.amp==null?0.8:o.amp,!!o.closed);tracePts(x,w,!!o.closed);
  if(o.fill){x.fillStyle=o.fill;x.fill();}if(!o.nostroke){x.lineWidth=o.w||1.6;x.strokeStyle=o.col||INK;x.lineJoin='round';x.lineCap='round';x.stroke();}return w;}
function blobPts(cx,cy,rx,ry,seed,irr,n){var r=mulberry32((seed|0)+3),pts=[],N=n||18,ph=r()*6.28,k1=1+Math.floor(r()*3),k2=3+Math.floor(r()*3);irr=irr==null?0.12:irr;
  for(var i=0;i<N;i++){var a=i/N*6.283+ph,f=1+irr*(Math.sin(a*k1+r()*0.6)*0.6+Math.sin(a*k2)*0.4);pts.push([cx+Math.cos(a)*rx*f,cy+Math.sin(a)*ry*f]);}return pts;}
// a filled, outlined irregular blob with a soft watercolour wash inside
function inkBlob(x,cx,cy,rx,ry,o){o=o||{};var pts=blobPts(cx,cy,rx,ry,o.seed||1,o.irr,o.n);var w=wobble(pts,(o.seed||1)+11,o.amp==null?0.7:o.amp,true);
  if(o.fill){x.save();tracePts(x,w,true);x.fillStyle=o.fill;x.fill();x.clip();washSpots(x,cx,cy,rx,ry,o.fill,o.seed||1,o.wash==null?1:o.wash);x.restore();}
  if(!o.nostroke){tracePts(x,w,true);x.lineWidth=o.w||1.5;x.strokeStyle=o.col||INK;x.lineJoin='round';x.stroke();}return w;}
// darker and lighter blotches, clipped by the caller, so flat fills read as paint
function washSpots(x,cx,cy,rx,ry,col,seed,k){var r=mulberry32((seed|0)+29),n=3+Math.floor(r()*3);for(var i=0;i<n;i++){var px=cx+(r()-0.5)*rx*1.6,py=cy+(r()-0.5)*ry*1.6,R=Math.max(rx,ry)*(0.4+r()*0.6),dark=r()<0.5;
  var g=x.createRadialGradient(px,py,0,px,py,R);g.addColorStop(0,rgba(shadeC(col,dark?-0.18:0.22),0.35*k));g.addColorStop(1,rgba(col,0));x.fillStyle=g;x.fillRect(px-R,py-R,R*2,R*2);}
  // a highlight along the top
  var hg=x.createLinearGradient(0,cy-ry,0,cy+ry);hg.addColorStop(0,rgba('#ffffff',0.16*k));hg.addColorStop(0.5,rgba('#ffffff',0));hg.addColorStop(1,rgba('#000000',0.08*k));x.fillStyle=hg;x.fillRect(cx-rx*1.3,cy-ry*1.3,rx*2.6,ry*2.6);}
// short ink strokes: grass tufts, hatching, fur
function inkTick(x,x0,y0,x1,y1,w,col){x.beginPath();x.moveTo(x0,y0);x.quadraticCurveTo((x0+x1)/2+(y1-y0)*0.15,(y0+y1)/2,x1,y1);x.lineWidth=w||1.2;x.strokeStyle=col||INK;x.lineCap='round';x.stroke();}
// paper grain, made once
var GRAIN=null;
function grainPattern(x){if(!GRAIN){var c=document.createElement('canvas');c.width=c.height=96;var g=c.getContext('2d'),d=g.createImageData(96,96);for(var i=0;i<d.data.length;i+=4){var v=Math.random();d.data[i]=d.data[i+1]=d.data[i+2]=v<0.5?40:255;d.data[i+3]=Math.floor(Math.random()*16);}g.putImageData(d,0,0);GRAIN=c;}return x.createPattern(GRAIN,'repeat');}
function grain(x,X,Y,W,H,a){x.save();x.globalAlpha=a==null?0.5:a;x.fillStyle=grainPattern(x);x.fillRect(X,Y,W,H);x.restore();}
// a little ink icon helper for buttons: draw(ctx,w,h) into a canvas element
function iconCanvas(w,h,draw){return miniCanvas(w,h,draw);}

/* ---- sound.js ---- */
// ===== Sound: small synthesized effects, plus the game's water and music loops =====
var AC=null,MASTER=null,BUS=null,NOISE=null,AMB={},SFX_LOOPS={};
function sfxUnlock(){if(AC||!S||!S.opt.sound)return;try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();MASTER=AC.createGain();MASTER.gain.value=0.82;MASTER.connect(AC.destination);BUS=AC.createGain();BUS.gain.value=0.5;BUS.connect(MASTER);
  var len=AC.sampleRate*2,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;NOISE=b;
  loadAmb('water','water.mp3',0.34);loadAmb('music','music.mp3',0.13);loadCatch();sfxAmbient();}catch(e){AC=null;}}
// Puti's two catch sounds from Shrimp Tanks; one is picked at random each time a shrimp is netted
var CATCH=[];
function loadCatch(){['catch-shrimp-1.mp3','catch-shrimp-2.mp3'].forEach(function(u){try{fetch(u).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer();}).then(function(ab){return new Promise(function(res,rej){AC.decodeAudioData(ab,res,rej);});}).then(function(b){CATCH.push(b);}).catch(function(){});}catch(e){}});}
['pointerdown','keydown'].forEach(function(ev){window.addEventListener(ev,function(){if(!AC)sfxUnlock();else if(AC.state==='suspended')AC.resume();},{capture:true,passive:true});});
function sfxMute(m){$('tb-mute').classList.toggle('muted',m);if(MASTER)MASTER.gain.setTargetAtTime(m?0:0.82,AC.currentTime,0.05);if(!m&&!AC)sfxUnlock();}
function loadAmb(k,url,vol){var a={vol:vol,g:AC.createGain(),src:null,buf:null,on:false};a.g.gain.value=0;a.g.connect(MASTER);AMB[k]=a;
  // next to the page when published as an artifact, or the game's copy when served from the repo
  try{fetch(url).then(function(r){if(r.ok)return r;return fetch('../shrimp/'+url);}).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer();}).then(function(ab){return new Promise(function(res,rej){AC.decodeAudioData(ab,res,rej);});}).then(function(buf){a.buf=buf;sfxAmbient();}).catch(function(){});}catch(e){}}
function ambSet(k,on){var a=AMB[k];if(!a||!AC)return;if(on&&a.buf&&!a.src){a.src=AC.createBufferSource();a.src.buffer=a.buf;a.src.loop=true;a.src.connect(a.g);a.src.start();}
  if(a.on===on)return;a.on=on;a.g.gain.cancelScheduledValues(AC.currentTime);a.g.gain.setTargetAtTime(on?a.vol:0,AC.currentTime,k==='water'?1.6:0.8);}
function sfxAmbient(){if(!AC||!S)return;var vis=!document.hidden;ambSet('water',vis&&activeTab==='tank');ambSet('music',vis);if(typeof outdoorAmb==='function')outdoorAmb(vis&&activeTab==='home'&&S.stage>=1);}
function env(g,t,a,peak,d){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}
function noiseSrc(){var s=AC.createBufferSource();s.buffer=NOISE;s.loop=true;s.playbackRate.value=0.8+Math.random()*0.4;return s;}
function tone(type,f0,f1,t,dur,vol,dest){var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);env(g,t,0.006,vol,dur);o.connect(g);g.connect(dest||BUS);o.start(t);o.stop(t+dur+0.05);}
function nburst(t,dur,vol,ftype,freq,q,dest){var s=noiseSrc(),f=AC.createBiquadFilter(),g=AC.createGain();f.type=ftype;f.frequency.value=freq;f.Q.value=q||1;env(g,t,0.004,vol,dur);s.connect(f);f.connect(g);g.connect(dest||BUS);s.start(t,Math.random());s.stop(t+dur+0.05);}
// one-shot effects
function sfx(name,o){if(!AC||!S||!S.opt.sound)return;o=o||{};var t=AC.currentTime,v=o.v||1;try{switch(name){
 case 'click':tone('sine',900,600,t,0.04,0.05*v);break;
 case 'nope':tone('triangle',220,160,t,0.12,0.08*v);break;
 case 'snip':nburst(t,0.025,0.25*v,'highpass',3500,0.8);nburst(t+0.035,0.03,0.18*v,'highpass',4200,0.8);tone('square',2600,1800,t,0.015,0.02*v);break;
 case 'pop':tone('sine',700,180,t,0.09,0.18*v);nburst(t,0.03,0.06*v,'bandpass',1500,2);break;
 case 'plip':tone('sine',1300+Math.random()*300,380,t,0.07,0.16*v);break;
 case 'plop':tone('sine',420,120,t,0.14,0.2*v);nburst(t,0.06,0.05*v,'lowpass',700,1);break;
 case 'drip':tone('sine',1700+Math.random()*700,700,t,0.05,0.08*v);break;
 case 'squelch':nburst(t,0.22,0.22*v,'lowpass',520,4);tone('sine',140,70,t,0.2,0.08*v);for(var i=0;i<4;i++)tone('sine',500+Math.random()*500,200,t+0.04*i+Math.random()*0.03,0.04,0.04*v);break;
 case 'suck':nburst(t,0.3,0.12*v,'bandpass',600,1.5);tone('sine',180,420,t,0.25,0.04*v);break;
 case 'scoop':nburst(t,0.12,0.1*v,'bandpass',900,1);tone('sine',600,900,t,0.08,0.05*v);break;
 case 'egg':tone('sine',520,480,t,0.05,0.12*v);tone('triangle',1040,900,t+0.01,0.03,0.03*v);break;
 case 'coin':tone('triangle',1320,1320,t,0.06,0.06*v);tone('triangle',1760,1760,t+0.07,0.09,0.06*v);break;
 case 'book':tone('sine',660,660,t,0.1,0.07*v);tone('sine',880,880,t+0.09,0.12,0.07*v);tone('sine',1320,1320,t+0.18,0.18,0.05*v);break;
 case 'chirp':var f=2600+Math.random()*1800;for(var j=0;j<2+Math.floor(Math.random()*3);j++){tone('sine',f,f*(1.2+Math.random()*0.4),t+j*0.09,0.06,0.035*v);}break;
 case 'splash':nburst(t,0.35,0.25*v,'lowpass',1400,0.7);nburst(t+0.02,0.2,0.12*v,'highpass',2500,0.7);break;
 case 'cast':nburst(t,0.25,0.08*v,'bandpass',2200,3);break;
 case 'cluck':tone('square',420,300,t,0.05,0.035*v);tone('square',380,260,t+0.09,0.07,0.03*v);break;
 case 'flap':for(var k=0;k<5;k++)nburst(t+k*0.06,0.04,0.08*v,'bandpass',800,1.2);break;
 case 'reel':for(var r=0;r<6;r++)tone('square',1800,1700,t+r*0.03,0.01,0.015*v);break;
 case 'thud':tone('sine',160,60,t,0.12,0.15*v);break;
 case 'pour':nburst(t,0.9,0.12*v,'bandpass',700,0.8);break;
 case 'catch':if(CATCH.length){var cs=AC.createBufferSource(),cg=AC.createGain();cs.buffer=CATCH[Math.floor(Math.random()*CATCH.length)];cg.gain.value=0.52*v;cs.connect(cg);cg.connect(BUS);cs.start(t);}else{tone('sine',700,180,t,0.09,0.18*v);}break;
 case 'push':tone('triangle',116,74,t,0.16,0.14*v);break;
 }}catch(e){}}
// held loops: sfxLoop(name) -> {set(level 0..1), stop()}
function sfxLoop(name){if(!AC||!S||!S.opt.sound)return {set:function(){},stop:function(){}};var t=AC.currentTime,g=AC.createGain();g.gain.value=0;g.connect(BUS);var nodes=[];
 try{if(name==='siphon'){var s=noiseSrc(),f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=700;f.Q.value=1.4;s.connect(f);f.connect(g);s.start();nodes.push(s);

// ---------- 1. Gravel vacuum ----------
// Drag anywhere and the tube moves with your finger, by the same amount. Hold its top, or drag from
// below the tank so your thumb never covers the mouth (Puti: the fingertip blocked the bottom).
// The brown fluff swirls up the tube, the water level drops, the bucket fills.
// A full bucket is a 30% change. Babies near the tube get pulled in, so you check the bucket and tap them back.
function vacToy(T){var V={p:null,on:false,water:0,cap:0.3,dirt:0,babies:[],parts:[],grains:[],mode:'vac',snd:null,no3a:T.no3,pour:0,refill:0,bucketBabies:[]};
  V.start=function(){V.snd=sfxLoop('siphon');V.bar();};
  V.bar=function(){if(V.mode==='vac')toyBar(barHtml(V.water>=0.999?'Bucket full. Check it for babies.':'Drag to move the tube over the gravel. Your finger can stay below it. Bucket '+Math.round(V.water*100)+'%'+(V.babies.length?' · '+plural(V.babies.length,'baby','babies')+' in it':''),''));
    else if(V.mode==='bucket')toyBar('<span>'+(V.babies.length?'Tap the babies to put them back':'Nothing alive in the bucket')+'</span><button class="btn primary" data-toyact="pour"'+(V.babies.length?' disabled':'')+'>Pour it out</button>');
    else toyBar('<span>Refilling with fresh water…</span>');};
  V.down=function(p){if(V.mode==='bucket'){V.tapBucket(p);return;}if(V.mode!=='vac'||V.water>=0.999)return;var tb=V.tube();V.grab={x:p[0],y:p[1],tx:tb.x,ty:tb.top};V.on=true;};
  V.move=function(p){if(!V.on||!V.grab)return;V.tx=V.grab.tx+(p[0]-V.grab.x);V.ty=V.grab.ty+(p[1]-V.grab.y);V.p=1;};
  V.up=function(){V.on=false;if(V.snd)V.snd.set(0);};
  V.finish=function(){if(V.mode==='vac'){if(V.water<0.02){toyEnd();return;}V.on=false;V.mode='bucket';V.layoutBucket();V.bar();sfx('pour',{v:0.4});}else if(V.mode==='bucket'){if(V.babies.length){toast('Put the babies back first');return;}V.act('pour');}};
  V.act=function(k){if(k==='pour'&&V.mode==='bucket'){V.mode='refill';V.refill=0;sfx('pour');V.bar();}};
  V.end=function(){if(V.snd)V.snd.stop();// anything still in the bucket goes back
    V.babies.forEach(function(i){V.back(i);});V.babies=[];T.level=1;TV.ag.forEach(function(a){a.hidden=false;});};
  V.tube=function(){var W=TV.W,H=TV.H,len=H*0.36,tw=Math.max(16,W*0.05);if(V.tx==null){V.tx=W*0.5;V.ty=H*0.5;}V.tx=clamp(V.tx,tw,W-tw);V.ty=clamp(V.ty,H*0.06,H*0.93-len);return {x:V.tx,y:V.ty+len,w:tw,top:V.ty};};
  V.step=function(dt){var W=TV.W,H=TV.H;if(V.mode==='vac'){var tb=V.tube(),active=V.on&&V.water<0.999;
     if(V.snd)V.snd.set(active?(tb.y>H*0.74?1:0.55):0);
     if(active){V.water=Math.min(1,V.water+dt/10);T.level=1-V.water*V.cap;
      if(tb.y>H*0.73){var R=tb.w*1.2;for(var i=0;i<MULM_N;i++){var cx=(i+0.5)/MULM_N*W,d=Math.abs(cx-tb.x);if(d<R&&T.mulm[i]>0){var take=Math.min(T.mulm[i],dt*2.4*(1-d/R));T.mulm[i]-=take;V.dirt+=take;var n=Math.ceil(take*40);for(var q=0;q<n;q++)V.parts.push({x:cx+rnd(-3,3),y:H*rnd(0.78,0.9),t:0,c:Math.random()<0.7?'rgba(96,70,40,.85)':'rgba(140,110,70,.7)',r:rnd(1,2.2),sw:rnd(0,6.28)});}}
        if(Math.random()<dt*14)V.grains.push({x:tb.x+rnd(-tb.w*0.35,tb.w*0.35),y:tb.y-2,vy:-rnd(30,60),t:0});}
      // babies get pulled toward the tube
      TV.ag.forEach(function(a){if(a.sc>0.5||a.hidden)return;var dx=tb.x-a.x,dy=tb.y-a.y,d=Math.hypot(dx,dy);if(d<tb.w*1.8){if(d<tb.w*0.45){a.hidden=true;var ind=a.ind;T.shrimp=T.shrimp.filter(function(z){return z!==ind;});V.babies.push(ind);V.parts.push({x:tb.x,y:tb.y,t:0,baby:1,c:'#fff',r:2.4,sw:0});V.bar();}else{var sp=tvBase()*0.9;a.pull=[dx/d*sp,dy/d*sp];}}});
      if(V.water>=0.999){V.on=false;if(V.snd)V.snd.set(0);V.bar();sfx('plop');}
      else if((V.bt=(V.bt||0)+dt)>0.5){V.bt=0;V.bar();}}
     // particles ride up the tube and out the hose
     V.parts.forEach(function(p){p.t+=dt;var tb2=V.tube();var tx=tb2.x+Math.sin(p.t*9+p.sw)*tb2.w*0.3;p.x+=(tx-p.x)*Math.min(1,dt*8);p.y-=dt*(140+p.t*120);});var tt=V.tube().top;V.parts=V.parts.filter(function(p){return p.y>tt+2&&p.t<3;});
     V.grains.forEach(function(g){g.t+=dt;g.vy+=dt*160;g.y+=g.vy*dt;});V.grains=V.grains.filter(function(g){return g.t<0.6;});}
   else if(V.mode==='bucket'){V.bucketBabies.forEach(function(b){b.a+=(Math.random()-0.5)*dt*3;b.x+=Math.cos(b.a)*dt*10;b.y+=Math.sin(b.a)*dt*10;var dx=b.x-V.bk.cx,dy=(b.y-V.bk.cy)/0.62;if(Math.hypot(dx,dy)>V.bk.r*0.78){b.a+=Math.PI;b.x-=Math.cos(b.a)*2;}});}
   else if(V.mode==='refill'){V.refill=Math.min(1,V.refill+dt/2.2);T.level=1-V.cap*V.water*(1-V.refill);if(V.refill>=1){var frac=V.water*V.cap,b0=Math.round(T.no3);T.no3=Math.max(2,T.no3*(1-frac));T.lastWC=Math.floor(S.day);T.lastClean.vac=Math.floor(S.day);
      toast('Changed '+Math.round(frac*100)+'% of the water'+(effectsOn()?'. Nitrate '+b0+' → '+Math.round(T.no3)+' ppm':'')+'.');toyEnd();}}};
  V.layoutBucket=function(){var W=TV.W,H=TV.H;V.bk={cx:W/2,cy:H*0.52,r:Math.min(W*0.3,H*0.62)};V.bucketBabies=V.babies.map(function(i){return {ind:i,x:V.bk.cx+rnd(-1,1)*V.bk.r*0.4,y:V.bk.cy+rnd(-1,1)*V.bk.r*0.25,a:rnd(0,6.28)};});
    V.specks=[];var n=Math.round(20+V.dirt*260);for(var i=0;i<Math.min(260,n);i++){var a=Math.random()*6.283,rr=Math.sqrt(Math.random())*V.bk.r*0.8;V.specks.push([V.bk.cx+Math.cos(a)*rr,V.bk.cy+Math.sin(a)*rr*0.62,rnd(0.8,2.2)]);}};
  V.tapBucket=function(p){var hit=null,bd=1e9;V.bucketBabies.forEach(function(b){var d=Math.hypot(p[0]-b.x,p[1]-b.y);if(d<22&&d<bd){bd=d;hit=b;}});if(!hit)return;V.bucketBabies.splice(V.bucketBabies.indexOf(hit),1);V.babies.splice(V.babies.indexOf(hit.ind),1);V.back(hit.ind);sfx('plip');V.bar();};
  V.back=function(ind){T.shrimp.push(ind);var a=TV.ag.find(function(z){return z.id===ind.id;});if(a){a.hidden=false;a.x=rnd(TV.W*0.2,TV.W*0.8);a.y=TV.H*0.32;a.surf='water';a.intent='swim';var sp=tvSpot('sand');a.tx=sp.x;a.ty=sp.y;a.tsurf='sand';a.speed=tvBase()*0.3;a.left=8;}};
  V.draw=function(x,g,t){var W=TV.W,H=TV.H;if(V.mode==='vac'){var tb=V.tube();
     // the gravel vac: a clear tube with a hose out of the top
     x.save();x.fillStyle='rgba(255,255,255,.22)';x.fillRect(tb.x-tb.w/2,tb.top,tb.w,tb.y-tb.top);
     V.grains.forEach(function(gr){x.fillStyle='#d8c294';x.beginPath();x.arc(gr.x,gr.y,1.3,0,6.283);x.fill();});
     V.parts.forEach(function(p){x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();});
     inkPath(x,[[tb.x-tb.w/2,tb.top],[tb.x-tb.w/2,tb.y]],{w:1.4,amp:0.3,seed:3});inkPath(x,[[tb.x+tb.w/2,tb.top],[tb.x+tb.w/2,tb.y]],{w:1.4,amp:0.3,seed:4});
     x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=2;x.beginPath();x.moveTo(tb.x-tb.w*0.25,tb.top+4);x.lineTo(tb.x-tb.w*0.25,tb.y-4);x.stroke();
     var hx=tb.x+(tb.x<W*0.6?1:-1)*W*0.25;x.strokeStyle='rgba(44,40,35,.85)';x.lineWidth=Math.max(4,tb.w*0.32);x.lineCap='round';x.beginPath();x.moveTo(tb.x,tb.top);x.quadraticCurveTo(tb.x,tb.top-H*0.1,clamp(hx,4,W-4),Math.max(2,tb.top-H*0.06));x.stroke();
     x.strokeStyle='rgba(200,225,228,.55)';x.lineWidth=Math.max(2,tb.w*0.16);x.beginPath();x.moveTo(tb.x,tb.top);x.quadraticCurveTo(tb.x,tb.top-H*0.1,clamp(hx,4,W-4),Math.max(2,tb.top-H*0.06));x.stroke();
     // the grip: a dark rubber cap where your finger holds it
     var gw=tb.w*1.35,gh=Math.max(12,tb.w*0.75);x.fillStyle='#3d3a33';x.beginPath();x.roundRect?x.roundRect(tb.x-gw/2,tb.top-2,gw,gh,4):x.rect(tb.x-gw/2,tb.top-2,gw,gh);x.fill();
     x.strokeStyle='rgba(255,255,255,.25)';x.lineWidth=1;for(var gi=1;gi<4;gi++){x.beginPath();x.moveTo(tb.x-gw/2+3,tb.top-2+gh*gi/4);x.lineTo(tb.x+gw/2-3,tb.top-2+gh*gi/4);x.stroke();}x.restore();
     if(!V.p){x.save();x.globalAlpha=0.55+0.3*Math.sin(t*3);x.fillStyle='#fff';x.font='600 12px Inter,system-ui';x.textAlign='center';x.fillText('drag anywhere',tb.x,tb.top+gh+14);x.restore();}}
   };
  V.drawTop=function(x,g,t){var W=TV.W,H=TV.H;
   // bucket gauge, top left
   if(V.mode!=='bucket'){var bx=10,by=8,bw=34,bh=30;x.save();x.fillStyle='rgba(251,248,241,.92)';x.beginPath();x.moveTo(bx,by);x.lineTo(bx+bw,by);x.lineTo(bx+bw-4,by+bh);x.lineTo(bx+4,by+bh);x.closePath();x.fill();var lv=V.water;
     x.save();x.clip();x.fillStyle=mixC('#a9d1d3','#7a5a36',clamp(V.dirt*2.2,0,0.85));x.fillRect(bx,by+bh*(1-lv),bw,bh*lv);x.restore();

   if(V.mode==='bucket'){var b=V.bk;x.save();x.fillStyle='rgba(34,32,27,.35)';x.fillRect(0,0,W,H);
     x.fillStyle='#e9e2d1';x.beginPath();x.ellipse(b.cx,b.cy,b.r*1.06,b.r*0.68,0,0,6.283);x.fill();x.strokeStyle=INK;x.lineWidth=1.6;x.stroke();
     x.fillStyle=mixC('#b9d6d2','#6e5230',clamp(V.dirt*2.2,0.15,0.85));x.beginPath();x.ellipse(b.cx,b.cy,b.r*0.92,b.r*0.58,0,0,6.283);x.fill();

     x.fillStyle='#fff';x.font='600 12px Inter,system-ui';x.textAlign='center';x.fillText('The bucket',b.cx,b.cy-b.r*0.72);x.restore();}

     for(var q=0;q<5;q++){var sx=bx2+bw2*1.2+Math.sin(t*9+q)*7,sy=wy2+Math.abs(Math.cos(t*7+q*1.7))*6;x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.arc(sx,sy,1.4,0,6.283);x.fill();}

  return V;}

// ---------- 2. Filter sponge (its own scene) ----------
function openSponge(T){var P={stage:'squeeze',dirt:clamp(1-T.flow,0.1,1),water:'old',murk:0,sq:0,parts:[],bub:[],warned:false,t:0,press:false,dn:0};
  openSheet({title:'Clean the filter sponge',onClose:function(){P.dead=true;if(P.upH)window.removeEventListener('pointerup',P.upH);},mount:function(el,api){
    el.innerHTML='<p class="hint" id="sp-line">Press and hold to squeeze, let go to let it soak. Old tank water keeps the good bacteria in it alive.</p><canvas class="sortcv" id="sp-cv" style="aspect-ratio:1.25/1;margin-top:8px"></canvas><div class="btns" id="sp-btns"></div>';
    var cv=$('sp-cv');var W=0,H=0,x=null;function size(){var r=cv.getBoundingClientRect();W=r.width;H=r.height;x=fitCanvas(cv,W,H);}size();
    function btns(h){$('sp-btns').innerHTML=h;}function line(t){$('sp-line').textContent=t;}
    function flow(){return clamp(1-P.dirt*0.95,0.05,1);}
    function bucketAt(cx,cy,bw,bh,col,lab,tap){x.save();var top=cy-bh/2,bot=cy+bh/2;x.beginPath();x.moveTo(cx-bw/2,top);x.lineTo(cx+bw/2,top);x.lineTo(cx+bw*0.4,bot);x.lineTo(cx-bw*0.4,bot);x.closePath();x.fillStyle='#d9d2c2';x.fill();
      x.save();x.clip();x.fillStyle=col;x.fillRect(cx-bw/2,top+bh*0.18,bw,bh);x.restore();x.strokeStyle=INK;x.lineWidth=1.6;x.stroke();x.beginPath();x.ellipse(cx,top,bw/2,bh*0.07,0,0,6.283);x.stroke();
      x.beginPath();x.arc(cx,top,bw*0.46,Math.PI*1.05,Math.PI*1.95);x.stroke();
      if(tap){x.fillStyle='#8c8c86';x.fillRect(cx+bw*0.12,top-bh*0.42,bw*0.32,bh*0.08);x.fillRect(cx+bw*0.34,top-bh*0.42,bw*0.08,bh*0.22);x.strokeStyle=INK;x.lineWidth=1.2;x.strokeRect(cx+bw*0.12,top-bh*0.42,bw*0.32,bh*0.08);
        x.strokeStyle='rgba(169,209,211,.9)';x.lineWidth=3;x.beginPath();x.moveTo(cx+bw*0.38,top-bh*0.2);x.lineTo(cx+bw*0.38,top+bh*0.18);x.stroke();}
      x.fillStyle=INK;x.font='600 13px Inter,system-ui';x.textAlign='center';x.fillText(lab,cx,bot+18);x.restore();}
    function sponge(cx,cy,w,h){var sq=P.sq,sx=1+sq*0.22,sy=1-sq*0.32;x.save();x.translate(cx,cy);x.scale(sx,sy);var col=mixC('#e2c983','#5e4426',clamp(P.dirt,0,1));inkBlob(x,0,0,w/2,h/2,{fill:col,seed:21,irr:0.05,w:1.6,wash:0.9});
      var r=mulberry32(5);for(var i=0;i<34;i++){x.fillStyle=rgba(shadeC(col,-0.35),0.55);x.beginPath();x.ellipse((r()-0.5)*w*0.8,(r()-0.5)*h*0.8,1.2+r()*1.6,0.9+r(),0,0,6.283);x.fill();}
      x.fillStyle='#3d3a33';x.fillRect(-w*0.08,-h/2-h*0.25,w*0.16,h*0.27);x.restore();}
    function draw(){if(P.dead)return;requestAnimationFrame(draw);var now=performance.now(),dt=P.last?Math.min(0.05,(now-P.last)/1000):0.016;P.last=now;P.t+=dt;size();x.clearRect(0,0,W,H);
      x.fillStyle='#f6f3ec';x.fillRect(0,0,W,H);grain(x,0,0,W,H,0.6);
      var bcx=W*0.5,bcy=H*0.62,bw=W*0.62,bh=H*0.56,col=mixC('#96af8c','#5e4426',clamp(P.murk,0,0.9));bucketAt(bcx,bcy,bw,bh,col,'Old tank water',false);
      // dirt clouds bloom and spread through the water
      P.parts.forEach(function(p){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.96;p.vy=p.vy*0.96+6*dt;p.r+=dt*7;});P.parts=P.parts.filter(function(p){return p.t<2.2;});
      x.save();var top=bcy-bh/2;x.beginPath();x.moveTo(bcx-bw/2,top+bh*0.18);x.lineTo(bcx+bw/2,top+bh*0.18);x.lineTo(bcx+bw*0.4,bcy+bh/2);x.lineTo(bcx-bw*0.4,bcy+bh/2);x.closePath();x.clip();
      P.parts.forEach(function(p){x.fillStyle='rgba(94,68,38,'+(0.5*(1-p.t/2.2)).toFixed(3)+')';x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();});
      P.bub.forEach(function(b){b.y-=dt*60;b.x+=Math.sin(b.y*0.1)*0.4;x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=1;x.beginPath();x.arc(b.x,b.y,b.r,0,6.283);x.stroke();});P.bub=P.bub.filter(function(b){return b.y>top+bh*0.2;});x.restore();
      // the sponge sits in the water
      var target=P.press?1:0;P.sq+=(target-P.sq)*Math.min(1,dt*(P.press?14:6));sponge(bcx,bcy+bh*0.08,W*0.2,H*0.24);
      // flow meter

    draw();

// ----- birds: they come to spots that suit them, closer when Millie keeps still -----
function computeSpots(){var m=M(),sp=[],hab={},shortN=0,longN=0,me=L.me;

  var tx=b.win?b.x+(Math.random()<0.5?-70:70):L.cam.x+(Math.random()<0.5?-80:L.VW+80),ty=b.win?b.y-50:L.cam.y-60-Math.random()*60;b.tx=tx;b.ty=ty;b.face=tx>b.x?1:-1;if(fast)sfx('flap',{v:0.6});

  if(L.spawnT>per){L.spawnT=0;var p=(L.hab.seed?0.5:0.24)*(me&&me.sit?1.6:1);if(Math.random()<p)spawnBird();}
  for(var bi=0;bi<L.birds.length;bi++){var b=L.birds[bi];b.t+=dt;b.ph+=dt;
    if(b.st==='in'){var k=clamp(b.t/b.dur,0,1),e=1-Math.pow(1-k,2);b.x=lerp(b.fx,b.spot.x,e);b.y=lerp(b.fy,b.spot.y,e)-Math.sin(k*Math.PI)*40;if(k>=1){b.st='stay';b.t=0;}}
    else if(b.st==='stay'){if(b.spot.hover){b.x=b.spot.x+Math.sin(b.ph*3)*5;b.y=b.spot.y+Math.sin(b.ph*5)*3;}
      b.peckT-=dt;if(b.peckT<=0){b.peck=!b.peck&&(b.spot.t==='feeder'||b.spot.t==='ground'||b.spot.t==='lawn'||b.spot.t==='path'||b.spot.t==='meadow');b.peckT=b.peck?0.6+Math.random()*1.2:0.8+Math.random()*2;
        if(b.peck&&b.spot.t==='feeder'&&b.spot.o)b.spot.o.s=Math.max(0,(b.spot.o.s||0)-0.006);if(!b.peck&&Math.random()<0.3)b.face=-b.face;
        if(!b.peck&&(b.spot.t==='lawn'||b.spot.t==='ground'||b.spot.t==='meadow')&&Math.random()<0.4){var nx=b.spot.x+(Math.random()-0.5)*30,ny=b.spot.y+(Math.random()-0.5)*12,nt=tileOf(nx,ny);if(passable(nt[0],nt[1])){b.spot={t:b.spot.t,x:nx,y:ny,o:b.spot.o};b.x=nx;b.y=ny;}}}

    else{var k2=clamp(b.t/b.dur,0,1);b.x=lerp(b.fx,b.tx,k2);b.y=lerp(b.fy,b.ty,k2*k2);if(k2>=1)b.gone=true;}}
  compact(L.birds,'gone');}
function compact(a,flag){var n=0;for(var i=0;i<a.length;i++){if(!a[i][flag])a[n++]=a[i];}a.length=n;}
function birdPose(b){if(b.st!=='stay'||b.spot.hover)return (Math.floor(b.ph*14)%2)?2:3;return b.peck&&Math.sin(b.ph*9)>0?1:0;}
function hitBird(wx,wy){var best=null,bd=34;L.birds.forEach(function(b){if(b.st!=='stay'&&b.st!=='in')return;var d=Math.hypot(b.x-wx,b.y-10-wy);if(d<bd){bd=d;best=b;}});return best;}
function watchBird(b){var me=L.me;if(me&&me.moving){me.path=[];me.moving=false;me.act=null;}L.watch={b:b,t:0};b.stay=Math.max(b.stay,b.t+3);faceTo(b.x,b.y);sfx('click');
  if(!LS().seen.watch)LS().seen.watch=1;}

  w.t+=dt;if(w.t>=1.5){var B=BIRD[b.sp];LS().stats.birds++;var isNew=bookAdd('birds',b.sp,{where:STAGES[S.stage].name});if(!isNew){showLabel(B.name,b.x,b.y-30);sfx('chirp');}L.watch=null;b.stay=Math.max(b.stay,b.t+4);L.dirty=true;updateStat(true);}}

// ----- hens in the garden, wild chickens out on the land -----
function areaPx(a){return a?{x0:a.x0*T,y0:a.y0*T,x1:(a.x1+1)*T,y1:(a.y1+1)*T}:null;}
function henArea(){return L.henPx!==undefined?L.henPx:(L.henPx=areaPx(M().henArea));}
function randIn(a){for(var k=0;k<30;k++){var x=a.x0+12+Math.random()*(a.x1-a.x0-24),y=a.y0+12+Math.random()*(a.y1-a.y0-24),t=tileOf(x,y);if(passable(t[0],t[1]))return [x,y];}return [(a.x0+a.x1)/2,(a.y0+a.y1)/2];}
function syncAgents(){var a=henArea(),coop=objsOf('coop')[0];L.wildPx=areaPx(M().wildArea);L.henPx=a;
  LS().hens.forEach(function(h){if(!L.henA[h.id]&&a){var p=coop?[oX(coop)+(Math.random()-0.5)*80,oBase(coop)+30+Math.random()*30]:randIn(a);var t=tileOf(p[0],p[1]);if(!passable(t[0],t[1]))p=randIn(a);
    L.henA[h.id]={id:h.id,kind:h.kind,x:p[0],y:p[1],st:'idle',t:0,dur:1,face:1,ph:Math.random()*9,tx:p[0],ty:p[1],cl:8+Math.random()*30};}});
  Object.keys(L.henA).forEach(function(id){if(!LS().hens.some(function(h){return h.id===id;}))delete L.henA[id];});
  var w=areaPx(M().wildArea);LS().wild.forEach(function(h){if(!L.wildA[h.id]&&w){var p=randIn(w);L.wildA[h.id]={id:h.id,kind:'wild',x:p[0],y:p[1],st:'idle',t:0,dur:1,face:1,ph:Math.random()*9,tx:p[0],ty:p[1],wild:1};}});
  Object.keys(L.wildA).forEach(function(id){if(!LS().wild.some(function(h){return h.id===id;}))delete L.wildA[id];});
  // fish kept in your pond
  var m=M(),pond=[];for(var y=0;y<m.h;y++)for(var x=0;x<m.w;x++)if(waterKind(x,y)===W_POND)pond.push([x,y]);L.pondTiles=pond;
  while(L.fishA.length>LS().pond.length)L.fishA.pop();
  while(L.fishA.length<LS().pond.length&&pond.length){var pt=pick(pond),f=LS().pond[L.fishA.length];L.fishA.push({kind:f.kind,len:f.len,x:pt[0]*T+T/2,y:pt[1]*T+T/2,a:Math.random()*6.28,ph:Math.random()*9});}}
function nearestGrain(c,r){var best=null,bd=r*r;L.grain.forEach(function(g){var d=(g.x-c.x)*(g.x-c.x)+(g.y-c.y)*(g.y-c.y);if(d<bd){bd=d;best=g;}});return best;}
function chickGo(c,x,y,area){var t=tileOf(x,y);if(!passable(t[0],t[1])){var p=randIn(area);x=p[0];y=p[1];}c.tx=clamp(x,area.x0+8,area.x1-8);c.ty=clamp(y,area.y0+8,area.y1-8);}
function stepChick(c,dt,area){c.t+=dt;c.ph+=dt;var me=L.me,dm=me?Math.hypot(c.x-me.x,c.y-me.y):1e9,g=nearestGrain(c,c.wild?T*8:T*5);
  function move(sp){var dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy);if(d<3)return true;var nx=c.x+dx/d*sp*dt,ny=c.y+dy/d*sp*dt;if(passable(Math.floor(nx/T),Math.floor(ny/T))){c.x=nx;c.y=ny;}else{c.st='idle';c.t=0;c.dur=0.6;return true;}if(Math.abs(dx)>0.5)c.face=dx>0?1:-1;return false;}
  if(c.st==='run'){if(move(96)||c.t>c.dur){c.st='idle';c.t=0;c.dur=1+Math.random()*2;}return;}
  if(c.st==='flap'){if(c.t>0.6){c.st='idle';c.t=0;c.dur=0.6;}return;}
  // wild ones keep away from Millie, unless they're busy with grain and she's creeping up
  if(c.wild&&me){var busy=c.st==='eat'||(c.ate&&L.rt-c.ate<2.5&&L.grain.length>0),scare=busy?(me.moving&&!me.sneak&&dm<T*1.3):(dm<T*(me.moving&&!me.sneak?3:1.6));
    if(scare){var ax=c.x-me.x,ay=c.y-me.y,ad=Math.hypot(ax,ay)||1;c.st='run';c.t=0;c.dur=1.6;chickGo(c,c.x+ax/ad*T*2.4,c.y+ay/ad*T*1.6,area);if(!c.ranOnce){c.ranOnce=1;sfx('flap',{v:0.5});}return;}}
  if(g&&!(c.wild&&me&&Math.hypot(g.x-me.x,g.y-me.y)<T*1.8&&!me.sneak&&c.st!=='eat')){var dx2=g.x-c.x,dy2=g.y-c.y,d2=Math.hypot(dx2,dy2);
    if(d2<12){c.st='eat';c.ate=L.rt;c.eatT=(c.eatT||0)+dt;c.face=dx2>=0?1:-1;if(c.eatT>1.1){c.eatT=0;g.gone=true;compact(L.grain,'gone');}return;}
    c.st='walk';grainStep(c,g);move(c.wild?24:32);return;}
  if(c.st==='eat')c.st='idle';
  if(c.st==='walk'){if(move(26)){c.st=Math.random()<0.6?'peck':'idle';c.t=0;c.dur=1+Math.random()*2.5;}}
  else if(c.t>c.dur){var p2=randIn(area);if(Math.hypot(p2[0]-c.x,p2[1]-c.y)>T*3.4){p2=[c.x+(p2[0]-c.x)*0.4,c.y+(p2[1]-c.y)*0.4];}chickGo(c,p2[0],p2[1],area);c.st='walk';c.t=0;}
  if(!c.wild){c.cl-=dt;if(c.cl<=0){c.cl=20+Math.random()*40;if(inView(c.x,c.y))sfx('cluck',{v:0.5});}}}
// toward the grain round whatever is in the way: follow the walking distance from where it landed
function grainStep(c,g){var F=L.grainField,m=M(),w=m.w,tx=Math.floor(c.x/T),ty=Math.floor(c.y/T),gx=Math.floor(g.x/T),gy=Math.floor(g.y/T);
  if(!F||(Math.abs(tx-gx)<=1&&Math.abs(ty-gy)<=1)){c.tx=g.x-(g.x>c.x?5:-5);c.ty=g.y;return;}
  var best=-1,bv=F[ty*w+tx];for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;var nx=tx+dx,ny=ty+dy;if(nx<0||ny<0||nx>=w||ny>=m.h)continue;var v=F[ny*w+nx];if(v<bv&&canStep(tx,ty,nx,ny)){bv=v;best=ny*w+nx;}}
  if(best<0){c.tx=g.x;c.ty=g.y;return;}c.tx=(best%w)*T+T/2;c.ty=((best/w)|0)*T+T/2+8;}
function chickPose(c){if(c.st==='walk'||c.st==='run')return Math.floor(c.ph*(c.st==='run'?14:8))%2;if(c.st==='peck'||c.st==='eat')return Math.sin(c.ph*10)>0?2:3;if(c.st==='flap')return 4;return 3;}
function hitChick(wx,wy,list,r){var best=null,bd=r;Object.keys(list).forEach(function(k){var c=list[k],d=Math.hypot(c.x-wx,c.y-16-wy);if(d<bd){bd=d;best=c;}});return best;}

// ----- particles -----
function puff(kind,x,y,n,o){o=o||{};for(var i=0;i<n;i++){var a=Math.random()*6.283,s=(o.speed||40)*(0.4+Math.random());L.parts.push({k:kind,x:x,y:y,vx:Math.cos(a)*s+(o.vx||0),vy:Math.sin(a)*s*0.6-(o.up||0),life:0,max:(o.life||0.7)*(kind==='heart'?1:(0.6+Math.random()*0.6)),col:o.col,r:o.r||1,g:o.g});}}

  p.vy=p.vy*Math.max(0,1-dr*dt)+(p.k==='drop'?300:p.k==='feather'?16:p.k==='seed'?(p.g||240):p.k==='clip'?60:0)*dt;if(p.life<p.max)a[n++]=p;}a.length=n;}
function drawParts(x){for(var i=0;i<L.parts.length;i++)drawPart(x,L.parts[i]);x.globalAlpha=1;}

  else if(p.k==='ring'){var rr=(4+(1-a)*18)*p.r;x.globalAlpha=clamp(0.85*a,0,1);x.fillStyle='#ffffff';for(var q=0;q<RING.length;q+=2){x.fillRect(Math.round(p.x+RING[q][0]/9*rr)-L.cdx,Math.round(p.y+RING[q][1]/9*rr*0.45)-L.cdy,1,1);}}
  else if(p.k==='drop')wrect(x,p.x,p.y,1,2,'#cbdbfc');

// ----- butterflies over flowers and long grass -----
function stepButterflies(dt){if(S.stage<2){if(L.bfl&&L.bfl.length)L.bfl.length=0;return;}var bf=L.bfl||(L.bfl=[]),want=S.stage>=3?4:2;
  if(L.bflFor!==L.spots){L.bflFor=L.spots;L.bflT=L.spots.filter(function(s){return s.t==='flowers'||s.t==='meadow';});}var targets=L.bflT;
  if(bf.length<want&&targets.length&&Math.random()<dt*0.5){var t0=pick(targets);bf.push({x:L.cam.x+(Math.random()<0.5?-20:L.VW+20),y:L.cam.y+Math.random()*L.VH,tx:t0.x,ty:t0.y-16,ph:Math.random()*9,c:Math.floor(Math.random()*BFLY_COLS.length),rest:0,life:25+Math.random()*30});}
  for(var bj=0;bj<bf.length;bj++){var b=bf[bj];b.ph+=dt;b.life-=dt;if(b.rest>0){b.rest-=dt;continue;}var dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy);
    if(d<4){b.rest=1+Math.random()*3;var t1=targets.length?pick(targets):{x:b.x+(Math.random()-0.5)*200,y:b.y+(Math.random()-0.5)*140};b.tx=t1.x+(Math.random()-0.5)*30;b.ty=t1.y-16+(Math.random()-0.5)*16;if(b.life<0){b.tx=L.cam.x-80;b.gone=b.life<-10;}}
    else{b.x+=dx/d*40*dt+Math.sin(b.ph*3)*0.6;b.y+=dy/d*40*dt+Math.sin(b.ph*7)*1;}if(b.x<L.cam.x-160||b.x>L.cam.x+L.VW+160)b.gone=true;}
  compact(bf,'gone');}
// ----- your pond fish -----
function pondAt(x,y){return waterKind(Math.floor(x/T),Math.floor(y/T))===W_POND;}
function pondOK(x,y){var tx=Math.floor(x/T),ty=Math.floor(y/T);if(waterKind(tx,ty)!==W_POND)return false;
  if(L.nat&&L.nat.pond&&natKind(M(),tx,ty)===1)return natW(x/T,y/T,-99,0)>0.5+0.25*NAT_K;
  return pondAt(x+14,y)&&pondAt(x-14,y)&&pondAt(x,y+12)&&pondAt(x,y-12);}

  var tail=Math.sin(f.ph*8)*2,tx=f.x-ca*(len/2+2),ty=f.y-sa*(len/2+2)*0.6;wrect(x,tx-1-sa*tail,ty-1+ca*tail,3,2,col);x.globalAlpha=1;}}

// ----- world <-> screen. The canvas has one pixel per art pixel; CSS scales it up crisp (image-rendering: pixelated) -----
function sxOf(wx){return Math.round(wx)-L.cdx;}
function syOf(wy){return Math.round(wy)-L.cdy;}

function toCss(wx,wy){return [(Math.round(wx)-L.cdx)*L.cpa,(Math.round(wy)-L.cdy)*L.cpa];}

// ----- pointer: tap to walk or use, hold and drag to steer Millie (in Build, drag looks around) -----
function localXY(e){var r=L.cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
function onDown(e){if(!L.cv)return;e.preventDefault();try{L.cv.setPointerCapture(e.pointerId);}catch(_){}var p=localXY(e);closeBub();
  L.ptr={id:e.pointerId,down:true,sx:p[0],sy:p[1],cx:p[0],cy:p[1],lx:p[0],ly:p[1],t0:performance.now(),mode:null,st:0};}
function onMove(e){var P=L.ptr;if(!P||!P.down||e.pointerId!==P.id)return;e.preventDefault();var p=localXY(e),dx=p[0]-P.lx,dy=p[1]-P.ly;P.cx=p[0];P.cy=p[1];
  if(!P.mode&&Math.hypot(p[0]-P.sx,p[1]-P.sy)>10)P.mode=L.tool==='build'?'pan':'steer';
  if(P.mode==='pan'){L.camFree=true;L.cam.x-=dx/L.cpa;L.cam.y-=dy/L.cpa;clampCam();L.dirty=true;}
  P.lx=p[0];P.ly=p[1];}
function onUp(e){var P=L.ptr;if(!P||e.pointerId!==P.id)return;P.down=false;
  if(P.mode===null&&e.type!=='pointercancel'){var w=fromCss(P.cx,P.cy);onTap(w[0],w[1],P.cx,P.cy);}
  P.mode=null;}
function stepPointer(){var P=L.ptr;if(!P||!P.down)return;var now=performance.now();
  if(!P.mode&&L.tool!=='build'&&now-P.t0>330)P.mode='steer';
  if(P.mode==='steer'&&now-P.st>110){P.st=now;var w=fromCss(P.cx,P.cy),t=tileOf(w[0],w[1]);if(L.fishing&&L.fishing.st!=='idle')L.fishing=null;
    if(passable(t[0],t[1]))walkTo(t,w[0],w[1],null);else{var me=L.me,st=tileOf(me.x,me.y),F=flood(st[0],st[1]),nr=nearestReachable(F,w[0],w[1],3);if(nr)walkTo(nr,null,null,null);}
    L.marker=null;}}

// ----- taps -----
function onTap(wx,wy,cx,cy){var t=tileOf(wx,wy),m=M(),me=L.me;if(!me)return;
  if(L.tool==='build'){tapBuild(wx,wy,t,cx,cy);return;}
  if(L.fishing&&L.fishing.st!=='idle'&&L.fishing.st!=='cast'){rodTap();return;}
  var b=hitBird(wx,wy);if(b){watchBird(b);return;}
  if(L.dog&&hitThing(L.dog.x,L.dog.y-28,wx,wy,34)){petDog();return;}
  if(L.cat&&hitThing(L.cat.x,L.cat.y-(L.cat.st==='paw'?30:16),wx,wy,30)){petCat();return;}
  var wc=hitChick(wx,wy,L.wildA,30);if(wc){goCatch(wc);return;}
  var hc=hitChick(wx,wy,L.henA,28);if(hc){henFlap(hc);return;}
  var o=interactAt(wx,wy);if(o&&useObj(o))return;
  var g=mget(m,t[0],t[1]);
  if(L.tool==='grain'&&g!==G_WATER){throwGrain(wx,wy);return;}
  // the bridge is a flat thing over the water: tapping it walks, it never sets a trap or casts
  if(g===G_WATER&&!objAtTile(t[0],t[1],true)){tapWater(wx,wy,t);return;}
  if(me.sit&&Math.hypot(wx-me.x,wy-me.y)<30){return;}
  if(walkTo(t,wx,wy,null)){L.marker={x:wx,y:wy,t:0};if(!LS().seen.walk){LS().seen.walk=1;updateStat(true);}}}
var USE_KINDS={tank:1,feeder:1,wfeeder:1,coop:1,armchair:1,trap:1,bench:1};
function interactAt(wx,wy){var ob=LS().objs.slice().sort(function(a,b){return oBase(b)-oBase(a);});
  for(var i=0;i<ob.length;i++){var o=ob[i],d=OBJ[o.k];if(!d||!USE_KINDS[o.k])continue;if(o.k==='armchair'&&!o.gm)continue;var r;
    if(d.hit)r=d.hit(o);else{var s=objSprite(o);if(!s)continue;r=[oX(o)-s.ax,oBase(o)-s.ay,s.w,s.h];}
    if(o.k==='coop'&&LS().eggs.length){var s2=objSprite(o);if(s2&&s2.nest&&Math.abs(wx-(oX(o)+s2.nest.x+15))<26&&Math.abs(wy-(oBase(o)+s2.nest.y))<22)return o;}
    if(wx>=r[0]&&wx<=r[0]+r[2]&&wy>=r[1]&&wy<=r[1]+r[3])return o;}return null;}
function zoomToTank(o){var cv=L.cv,s=objSprite(o);if(!cv||!s){goTank(o.i);return;}var c=toCss(oX(o),oBase(o)-s.ay/2);
  cv.style.transformOrigin=Math.round(c[0])+'px '+Math.round(c[1])+'px';cv.style.transition='transform .24s ease-in, opacity .24s ease-in';cv.style.transform='scale(1.6)';cv.style.opacity='0.25';
  setTimeout(function(){S.fromHome=1;goTank(o.i);cv.style.transition='';cv.style.transform='';cv.style.opacity='';},240);}
function bubAt(wx,wy,html,mount){var c=toCss(wx,wy);showBub(c[0],c[1],html,mount);}
function useObj(o){
  if(o.k==='tank'){goUse(o,function(){if(S.tanks[o.i]){sfx('click');zoomToTank(o);return;}var s=objSprite(o);bubAt(oX(o),oBase(o)-(s?s.ay:60),'<b>An empty stand</b><div class="btns"><button class="btn primary" data-setup>Set up a tank here · '+fmtA(300)+'</button></div>',function(el){var b=el.querySelector('[data-setup]');if(b)b.onclick=function(){var T=setupTank();if(!T)return;closeBub();sfx('plop');toast(T.name+' is set up. A few stones to start.');goTank(S.tanks.length-1);};});});return true;}
  if(o.k==='feeder'||o.k==='wfeeder'){goUse(o,fillFeeder);return true;}
  if(o.k==='coop'){goUse(o,function(){collectEggs(o);});return true;}
  if(o.k==='armchair'&&o.gm){goUse(o,function(){grandmaSays(o);});return true;}
  if(o.k==='trap'){goUse(o,trapTap);return true;}
  if(o.k==='bench'){var me=L.me;if(me.sit&&me.sit.o===o)return true;goUse(o,sitOn);return true;}

function henFlap(hc){hc.st='flap';hc.t=0;sfx('cluck');puff('feather',hc.x,hc.y-16,3,{col:HEN[hc.kind].body,speed:30,life:1.1});}
// walk to the bank next to some water, then do fn
function goBank(wx,wy,t,fn){var me=L.me,m=M(),st=tileOf(me.x,me.y),F=flood(st[0],st[1]),best=null,bs=1e9;
  for(var y=t[1]-3;y<=t[1]+3;y++)for(var x=t[0]-3;x<=t[0]+3;x++){if(x<0||y<0||x>=m.w||y>=m.h)continue;var d=F.dist[y*m.w+x];if(!isFinite(d))continue;
    var wet=false;[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(q){if(mget(m,x+q[0],y+q[1])===G_WATER)wet=true;});if(!wet)continue;
    var sc=d*0.6+Math.hypot((x+0.5)*T-wx,(y+0.5)*T-wy)/T*1.4;if(sc<bs){bs=sc;best=[x,y];}}

// ----- mowing: she pushes the mower where she walks, every grass tile she passes gets cut -----
function dirVec(d){return d==='right'?[1,0]:d==='left'?[-1,0]:d==='down'?[0,1]:[0,-1];}
// where the mower is: sets L.mpX, L.mpY
function mowerPos(){var me=L.me,d=me.dir;L.mpX=me.x+(d==='right'?30:d==='left'?-30:0);L.mpY=me.y+(d==='down'?20:d==='up'?-14:2);}
function mowTile(tx,ty){var m=M();if(tx<0||ty<0||tx>=m.w||ty>=m.h)return 0;var i=mi(m,tx,ty),g=m.g[i];if(!isGrass(g))return 0;var h=m.gh[i];if(h<=0.04)return 0;
  m.gh[i]=0;touchTile(tx,ty);LS().stats.mowed++;mowerPos();puff('clip',L.mpX,L.mpY-4,Math.ceil(h*6),{speed:60,up:30,col:g===G_MEADOW?'#8f974a':'#6abe30',life:0.6});
  if(g===G_MEADOW&&h>0.6&&Math.random()<0.3)puff('spark',L.mpX,L.mpY-6,1,{col:pick(WFL_HEX),speed:30});return h;}
var WFL_HEX=['#fbf236','#ffffff','#d77bba','#639bff'];
function stepMow(dt){var me=L.me;if(L.tool!=='mow'||!me){if(L.mower){L.mower.stop();L.mower=null;}return;}
  var cut=0;if(me.moving){var tx=Math.floor(me.x/T),ty=Math.floor((me.y-4)/T);mowerPos();cut+=mowTile(tx,ty)+mowTile(Math.floor(L.mpX/T),Math.floor(L.mpY/T));
    // grass you can't stand on (under a bush, by a fence) is cut as you go past it
    for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){var nx=tx+dx,ny=ty+dy;if(!passable(nx,ny)&&isGrass(mget(M(),nx,ny)))cut+=mowTile(nx,ny);}
    L.mowT=0.5;if(!L.mower)L.mower=sfxLoop('mower');}
  else L.mowT-=dt;
  if(L.mower){if(L.mowT<=0){L.mower.stop();L.mower=null;}else L.mower.set(me.moving?clamp(0.35+cut*0.8,0,1):0.15);}
  if(cut>0&&!LS().seen.mow){LS().seen.mow=1;}}

var GM_LINES=['The red ones are getting redder.','Did you eat?','Don’t change all the water at once.','That sparrow comes every morning. I call him Lao Wang.','When I was your age I kept fish in a washing bowl.','Sit with me a bit.','Your grandpa says hello.','Shrimp don’t like loud music. I checked.','Pierre was at the tank again. He only watches.','The dog brought me a sock. I said thank you.'];

// ----- grain and wild chickens -----
function throwGrain(wx,wy,walked){var me=L.me,d=Math.hypot(wx-me.x,wy-me.y);
  if(d>T*3.2&&!walked){var k=(d-T*2.4)/d,gx=me.x+(wx-me.x)*k,gy=me.y+(wy-me.y)*k,t=tileOf(gx,gy),st=tileOf(me.x,me.y),F=flood(st[0],st[1]),nr=passable(t[0],t[1])?t:nearestReachable(F,gx,gy,3);
    if(nr){walkTo(nr,gx,gy,function(){throwGrain(wx,wy,true);});return;}}
  if(me.sit)standUp();faceTo(wx,wy);sfx('scoop',{v:0.6});var hx=me.x,hy=me.y-46;
  for(var i=0;i<10;i++){var tx=wx+(Math.random()-0.5)*30,ty=wy+(Math.random()-0.5)*16,tt=0.42;L.parts.push({k:'seed',x:hx,y:hy,vx:(tx-hx)/tt,vy:(ty-hy)/tt-0.5*260*tt,life:0,max:tt,g:260});}
  setTimeout(function(){if(L.grain.length>80)L.grain.splice(0,10);for(var j=0;j<9;j++){var gx2=wx+(Math.random()-0.5)*30,gy2=wy+(Math.random()-0.5)*16,t2=tileOf(gx2,gy2);if(passable(t2[0],t2[1]))L.grain.push({x:gx2,y:gy2});}
    var gt=tileOf(wx,wy);if(passable(gt[0],gt[1])){var F=flood(gt[0],gt[1],10);L.grainField=new Float32Array(F.dist);}},420);
  var l=LS();if(!l.seen['grain'+(S.stage>=3?3:2)]){l.seen['grain'+(S.stage>=3?3:2)]=1;toast(S.stage>=3?'Step back and wait. When a chicken pecks the grain, tap it.':'The hens come running.',3600);}}
// busy with the grain: pecking now, or just moved to the next bit
function pecking(c){return c.st==='eat'||(c.ate&&L.rt-c.ate<2.5&&L.grain.length>0);}
function goCatch(c){var me=L.me;if(!pecking(c)){toast('Wait till it pecks the grain, then tap it.');sfx('nope');return;}
  var t=tileOf(c.x,c.y),st=tileOf(me.x,me.y),F=flood(st[0],st[1]),best=null,bd=1e9;
  for(var y=t[1]-1;y<=t[1]+1;y++)for(var x=t[0]-1;x<=t[0]+1;x++){var d=F.dist[y*M().w+x];if(isFinite(d)&&d<bd){bd=d;best=[x,y];}}
  if(!best)return;var ex=c.x+(me.x<c.x?-30:30),ey=c.y+4;walkTo(best,ex,ey,function(){if(L.wildA[c.id]&&pecking(c)&&Math.hypot(c.x-L.me.x,c.y-L.me.y)<T*1.8)catchWild(c);else toast('It ran off. Try more grain.');},{sneak:true,speed:ME_SPEED});
  if(!LS().seen.sneak){LS().seen.sneak=1;toast('Creeping up…');}}
function catchWild(c){var l=LS();faceTo(c.x,c.y);l.wild=l.wild.filter(function(w){return w.id!==c.id;});delete L.wildA[c.id];var id='h'+(++l.oid);l.hens.push({id:id,kind:'wild'});
  puff('feather',c.x,c.y-16,10,{col:'#c4562a',speed:50,life:1.3});sfx('flap');sfx('cluck');syncAgents();
  bookAdd('coop','hen-wild',{where:'the land'});toast('You caught a wild junglefowl. She lives in the coop now.');save();}

function openTrap(o){var n=2+Math.floor(Math.random()*6),list=[];if(typeof breedWild==='function'){for(var i=0;i<n;i++){try{list.push(breedWild());}catch(e){console.error(e);}}}

// ----- fishing in the stream and the lake; keep what you catch in a bucket and let it into your pond -----
// the rod tip: sets L.tipX, L.tipY
function rodTip(){var me=L.me,d=me.dir;L.tipX=me.x+(d==='right'?40:d==='left'?-40:16);L.tipY=me.y-70+(d==='down'?16:0);}
function goFish(wx,wy,t){if(!wildWater(t[0],t[1])){toast(waterKind(t[0],t[1])===W_POND?'Your fish live here. Fish in the stream or the lake.':'No fish here.');return;}
  if(L.fishing&&L.fishing.st!=='idle')return;goBank(wx,wy,t,function(){castAt(wx,wy);});}
function castAt(wx,wy){var me=L.me,d=Math.hypot(wx-me.x,wy-me.y),tx=wx,ty=wy;if(d>T*3.2){tx=me.x+(wx-me.x)/d*T*2.6;ty=me.y+(wy-me.y)/d*T*2.6;}
  var t=tileOf(tx,ty);if(!wildWater(t[0],t[1])){var tt=tileOf(wx,wy);tx=tt[0]*T+T/2;ty=tt[1]*T+T/2;t=tt;}
  // the banks curve, so the float is nudged out from the edge into open water
  if(L.nat&&natKind(M(),t[0],t[1])===1){var deep=L.nat.stream&&isStream(t[0],t[1])?[tx,streamCy(tx/T)*T]:L.nat.lake&&waterKind(t[0],t[1])===W_LAKE?[L.nat.lake.cx*T,L.nat.lake.cy*T]:null;
    for(var q=0;deep&&q<40&&natW(tx/T,ty/T,streamCy(tx/T),streamW(tx/T))<0.5+0.3*NAT_K;q++){var ddx=deep[0]-tx,ddy=deep[1]-ty,dl=Math.hypot(ddx,ddy);if(dl<4)break;tx+=ddx/dl*4;ty+=ddy/dl*4;}}
  rodTip();L.fishing={st:'fly',x0:L.tipX,y0:L.tipY,x1:tx,y1:ty,x:L.tipX,y:L.tipY,t:0,water:isStream(t[0],t[1])?'stream':'lake'};sfx('cast');updateStat(true);}
function rodTap(){var f=L.fishing;if(!f)return;if(f.st==='fly')return;if(f.st==='wait'){toast('Too soon, it swam off.');f.st='idle';updateStat(true);return;}
  if(f.st==='bite'){f.st='reel';f.t=0;sfx('splash');sfx('reel');puff('drop',f.x,f.y,12,{speed:60,up:60,life:0.7});}}
function stepFishing(dt){var f=L.fishing;if(!f)return;f.t+=dt;var me=L.me;if(me&&me.moving&&f.st!=='reel'){L.fishing=null;updateStat(true);return;}
  if(f.st==='fly'){var k=clamp(f.t/0.55,0,1);f.x=lerp(f.x0,f.x1,k);f.y=lerp(f.y0,f.y1,k)-Math.sin(k*Math.PI)*70;if(k>=1){f.st='wait';f.t=0;f.bite=2+Math.random()*6;f.tw=[];for(var i=0;i<1+Math.floor(Math.random()*3);i++)f.tw.push(Math.random()*f.bite*0.85);f.tw.sort();puff('ring',f.x,f.y+2,1,{speed:0,life:1.1,r:1.2});sfx('plop');updateStat(true);}}
  else if(f.st==='wait'){while(f.tw.length&&f.t>=f.tw[0]){f.tw.shift();f.dip=0.25;puff('ring',f.x,f.y+2,1,{speed:0,life:0.6,r:0.5});sfx('plip',{v:0.35});}if(f.dip>0)f.dip-=dt;if(f.t>=f.bite){f.st='bite';f.t=0;puff('ring',f.x,f.y+2,1,{speed:0,life:0.9,r:1.4});sfx('plip');updateStat(true);}}
  else if(f.st==='bite'){if(f.t>0.85){f.st='miss';f.t=0;toast('It got away.');updateStat(true);}}

  if(b.dataset.mess){var T=S.tanks[S.sel];if(b.dataset.mess==='all'){['vac','sponge','trim','pests'].forEach(devMess);toast(T.name+' needs everything now. Have a look in Tank.');}else{var l=[];for(var q=0;q<6;q++)l.push(breedWild());addToTank(T,l,'stream');toast('6 wild shrimp in '+T.name);}save();return;}
  if(b.id==='resetp'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again to erase the prototype';setTimeout(function(){delete b.dataset.sure;b.textContent='Reset the prototype';},3500);return;}try{localStorage.removeItem(SAVE_KEY);}catch(e){}S=newState();modCall('init',true);setTab('home');toast('Started over');return;}
  if(b.id==='copynotes'){var txt=PROPS.map(function(p){var n=noteOf(p.id);return p.t+': '+(n.r||'-')+(n.t?' — '+n.t:'');}).join('\n');var box=$('copybox');box.value=txt;
    try{navigator.clipboard.writeText(txt).then(function(){toast('Copied');},function(){box.hidden=false;box.select();toast('Select and copy the text below');});}catch(err){box.hidden=false;box.select();}}});
document.addEventListener('input',function(e){var t=e.target;if(!t.id||t.id.indexOf('note-')!==0)return;var n=noteOf(t.id.slice(5));n.t=t.value.slice(0,2000);n.at=Date.now();notesSave();});

start();
