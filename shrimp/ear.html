<div class="top"><button id="b-back" aria-label="Back to the game">‹ Back</button><h1>The tank you can hear</h1><button id="b-help" aria-label="Every sound, tap to hear it" aria-expanded="false">?</button></div>
<p id="day" class="muted" aria-live="off"></p>
<button id="b-play" aria-pressed="false">Play</button>
<button class="pri" id="b-feed">Feed</button>
<button class="pri" id="b-water">Change water</button>
<button id="b-hear">Hear the tank</button>
<p>Soft random ticks are shrimp eating. If it hisses or the beep gets fast, feed less and change some water.</p>
<p id="st" role="status" aria-live="polite"></p>
<button id="again" hidden>Start a new tank</button>
<div id="help" hidden><div class="in"><div class="top"><button onclick="document.getElementById('b-help').click()" aria-label="Close">‹ Back</button><h1>Every sound</h1><span style="min-width:44px"></span></div><p class="muted">Tap one to hear it.</p><div id="help-list"></div></div></div>
<script>
'use strict';
/* ---------- SOUND: every number you may want to tune by ear ---------- */
var SOUND={
  master:0.6,
  /* the water pulse: one soft low beep, slow when the water is fine, faster as any reading goes bad */
  /* the monitor: a soft beep that follows nitrite and nitrate. Slow and low when fine, faster and higher as it goes bad. */
  /* the monitor style: a beat every 1.1 s when fine, every 0.4 s when bad (like a heart rate going from 55 to 150) */
  /* water zone z: 0 perfect, 1 the start of amber, 2 the start of red (the test strip's lines). A beep every 8 s at 0, every 1 s at 1, nonstop at 2, straight lines between. */
  monitor:{lo:880,hi:1250,ms:110,gain:0.6,at0:8,at1:1,at2:0.14},
  pulse:{gain:0.05,ms:140, hzGood:520,hzBad:1050, slow:6,fast:0.55},
  /* the filter: a soft water flow all the time (pink noise, low-passed, slowly breathing) plus a trickle where the outflow hits the surface */
  flow:{gain:0,lo:220,hi:900,breathe:0.08,depth:0.35, trickle:{gain:0,hz:1400,q:0.9,rate:0.31,depth:0.6}}, /* off: it sounded like wind */
  /* the filter as a small fountain: many tiny droplets, each a short sine that rises in pitch (that's how a drop rings), at random times.
     rate a second, a slow swell in rate so it isn't a machine; a clogged filter drips less. */
  /* other filter sounds to pick from (Filter sound on the Play screen) */
  trickle:{rate:3.5,cLo:2,cHi:7,lo:900,hi:3200,riseLo:1.6,riseHi:3,msLo:10,msHi:28,gain:0.05,bed:0.08},
  bubbler:{rate:30,lo:260,hi:720,rise:1.5,msLo:20,msHi:45,gain:0.035,bed:0.07},
  brook:{gain:0.8,voices:[[520,380,10],[900,600,14],[1500,900,18]],q:9,modHz:11},
  fountain:{rate:16,swell:0.35,swellHz:0.05,gain:0.05,lo:550,hi:2400,rise:1.9,msLo:14,msHi:45, big:{p:0.06,lo:320,hi:520,ms:70,gain:0.03}},
  room:{noiseGain:0.0,noiseLo:350,noiseHi:1200, bubbleGain:0.05,bubbleHz:700,bubbleRise:1.6,bubbleMs:45, bubbleEvery:0.55, tempSpan:0.18, clogSlow:0.8,clogDull:0.45},
  /* eating: a short munch, 2 to 4 scrapes. Babies high and quick, adults low wooden. Every shrimp has its own pace (rate). */
  eat:{gain:0.16, baby:{hz:1700,n:3,gap:0.055,ms:18,type:'sine'}, juv:{hz:1000,n:3,gap:0.08,ms:30,type:'triangle'}, adult:{hz:560,n:3,gap:0.11,ms:50,type:'triangle'}, jitter:0.08, every:2.2, rateLo:0.6,rateHi:1.6, surface:0.06, stressMs:14},
  /* stationary: a faint antenna flick now and then. Fades in as the eating fades out. */
  idle:{gain:0.035,hz:2600,ms:16,every:9},
  /* swimming: a dart through the water, a soft whoosh that rises then falls. Babies shorter and higher. More darting right after feeding, when they move toward the food. */
  swim:{gain:0.045,lo:450,hi:1300, short:{s:0.22},long:{s:0.9,wob:5}, longP:0.3, every:28,feedMul:0.25},
  tick:{gain:0.11,baby:1500,juv:950,adult:620,jitter:0.06},
  molt:{gain:0.16,from:1400,to:420,s:0.7, fail:{s:0.45,wob:9,knock:220,knockMs:380,gain:0.26}},
  berried:{gapMs:130},
  babies:{gain:0.03,hz:2300,n:7,span:0.9},
  feed:{gain:0.09,hz:1300,n:7,span:1.0,ms:70,bloop:{hz:380,ms:160,gain:0.07},clusterS:60,clusterMul:0.3, delay:0.9,
    /* the shaker: three soft shakes, each a spray of tiny grains */
    game:0.5,
    shake:{nLo:3,nHi:8,gapLo:0.3,gapHi:0.55,grLo:8,grHi:22,lenLo:0.07,lenHi:0.16,hzLo:4200,hzHi:8000,gain:0.06}},
  /* ammonia: from barely there at 0.1 ppm to hard to ignore past 1.5 */
  hiss:{gain:0.01,max:0.22,hz:5000,q:0.7,full:1.5},
  dull:{clearHz:9000,oldHz:1700,oldAt:80},
  /* water change: a soft drain (low gurgle, 2 s) then a refill (a trickle, 3 s), both filtered noise with slow fades */
  /* water change, four to pick from on the Play screen (WC). A: filtered-noise trickle. B: bubbly pour, many rising sine pops over a soft noise. C: droplets, falling plips that get dense then thin. D: glugs, low wobbling tones then a smooth pour. */
  pour:{drain:{gain:0.05,hz:520,q:0.9,s:2.0,wob:4}, fill:{gain:0.055,hz:1600,q:0.6,s:3.0,wob:7}},
  pourB:{n:60,s:3.5,hz:600,rise:2.2,ms:60,gain:0.045,bed:0.02},
  pourC:{n:40,s:3.5,hz:1500,ms:80,gain:0.05,bedHz:700,bed:0.015},
  pourD:{glugs:6,hz:240,ms:220,gain:0.06,s:1.6,fill:{gain:0.035,hz:1200,q:0.5,s:2.6,wob:9}},
  /* the water change: the old water glugs out, then a tap runs (pink noise, two bands, a fast flutter) */
  tap:{glugsLo:7,glugsHi:12,hz:260,ms:230,gain:0.09,gapLo:0.18,gapHi:0.4, run:{s:3.2,gain:0.07,lo:900,hi:2600,flutter:13}},
  /* death: babies a small high tap, adults a low knock with a long tail, louder */
  death:{baby:{gain:0.06,hz:900,ms:60},adult:{gain:0.3,hz:240,ms:420}},
  minGapS:1.4
};
/* ---------- model ---------- */
var KEY='shrimp-ear-v1', SPEEDS=[['real time',1/3600],['a day every 2 minutes',24/120],['a day a minute',24/60],['a day in 5 seconds',24/5]];
var THINGS=['nothing','rock','driftwood','moss','a plant'];
var S=null, UI={}, A=null, speaking=false, vol=0.6, lastReal=0, speedIx=3, playMode=true, cluster=0, evq=[], lastEv=0, teachOn=false;
function $(id){return document.getElementById(id)}
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function mkShrimp(age,sex){var id=++S.nid;return {id:id,age:age,rate:rnd(SOUND.eat.rateLo,SOUND.eat.rateHi),sex:sex||(Math.random()<0.5?'f':'m'),hunger:rnd(0.1,0.5),berried:0,moltIn:age<75?rnd(2,12):rnd(8,45)}}
function newState(scape,n,history){
  S={v:1,h:0,day:0,nid:0,scape:scape,shrimp:[],food:0,nh3:0,no2:0,no3:10,temp:24,clog:0,moss:0,ration:1,jobs:[],log:[],seen:{},history:history||'',last:Date.now(),speed:0,voice:true,vol:60,taught:false};
  for(var i=0;i<scape.length;i++)if(scape[i]===3)S.moss+=0.25;
  S.moss=Math.min(1,S.moss);
  for(i=0;i<n;i++)S.shrimp.push(mkShrimp(rnd(60,300)));
  save();
}
function save(){S.last=Date.now();S.speed=speedIx;S.voice=speaking;S.vol=Math.round(vol*100);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1){S=s;speedIx=s.speed==null?3:s.speed;speaking=s.voice===true;vol=(s.vol==null?60:s.vol)/100;return true}}catch(e){}return false}
function sizeOf(s){return s.age<30?'baby':s.age<75?'juv':'adult'}
function adults(){return S.shrimp.filter(function(s){return s.age>=75})}
function logit(t){S.log.unshift('Day '+Math.floor(S.day)+', '+t);if(S.log.length>30)S.log.length=30}
function ev(k,d){evq.push({k:k,d:d||{}})}
/* one hour at most per call */
function step(h){
  var n=S.shrimp.length, i, s;
  S.h+=h; S.day=S.h/24;
  // jobs the store does
  for(i=S.jobs.length-1;i>=0;i--){var j=S.jobs[i];if(S.h>=j.at){S.jobs.splice(i,1);doJob(j.k)}}
  // temperature: slow drift round 24, the store keeps a heater on
  S.temp+= (24-S.temp)*0.02*h + rnd(-0.08,0.08)*h; S.temp=Math.max(20,Math.min(30,S.temp));
  // filter clogs over a month
  S.clog=Math.min(1,S.clog+h/720);
  var bact=(0.025+n*0.002)*(1-0.6*S.clog); // ppm an hour the filter can take
  // eating
  var eaters=S.shrimp.filter(function(x){return x.hunger>0.1}).length;
  var eat=Math.min(S.food, eaters*0.01*h);
  S.food-=eat;
  for(i=0;i<n;i++){s=S.shrimp[i];s.hunger=Math.min(1,s.hunger+h/72);}
  if(eat>0){var share=eat/Math.max(1,eaters);for(i=0;i<n;i++){s=S.shrimp[i];if(s.hunger>0.1)s.hunger=Math.max(0,s.hunger-share*25);}}
  // moss and biofilm feed them a little
  for(i=0;i<n;i++){s=S.shrimp[i];s.hunger=Math.max(0,s.hunger-(0.004+0.006*S.moss)*h);}
  // leftover food rots
  var rot=S.food*0.03*h; S.food-=rot; S.nh3+=rot*0.8 + n*0.0005*h;
  var c1=Math.min(S.nh3,bact*h); S.nh3-=c1; S.no2+=c1;
  var c2=Math.min(S.no2,bact*0.9*h); S.no2-=c2; S.no3+=c2*3;
  S.no3+= (0.01 + n*0.0005)*h; // with the nitrite that turns, about 5 ppm a week for a small colony
  S.no3-= S.moss*0.004*h; S.no3=Math.max(0,S.no3);
  var bad=S.nh3+S.no2*0.7;
  // each shrimp
  for(i=n-1;i>=0;i--){
    s=S.shrimp[i]; s.age+=h/24; s.moltIn-=h/24;
    var die=0;
    if(bad>0.3)die+= (bad-0.3)*0.004*h;
    if(S.temp>28.5)die+= (S.temp-28.5)*0.003*h;
    if(s.age>600)die+= (s.age-600)/900*0.004*h;
    if(s.age<30)die+= 0.00028*h; // about 60% of babies make it
    if(n>40)die+= (n-40)/40*0.0006*h; // crowding: a soft cap around 50
    if(s.moltIn<=0){
      s.moltIn=s.age<75?rnd(3,12):rnd(15,45);
      var wc7=(S.wc||[]).filter(function(d){return S.day-d<7}).length; /* water changed more than twice in a week: molts fail (the game's too-much-new-water rule) */
      var fail=0.02+S.no3/400+bad*0.1+Math.max(0,wc7-2)*0.25;
      if(Math.random()<fail){die=1}else ev('molt',{id:s.id})
    }
    if(Math.random()<die){S.shrimp.splice(i,1);logit(die===1?'a molt failed':sizeOf(s)==='baby'?'a baby died':'a shrimp died');if(die!==1)ev('death',{id:s.id,age:s.age});else ev('moltfail',{id:s.id,age:s.age});continue}
    if(s.berried>0){s.berried-=h/24;if(s.berried<=0){s.berried=0;var k=Math.floor(rnd(5,12));for(var b=0;b<k;b++)S.shrimp.push(mkShrimp(0));logit(k+' babies');ev('babies',{n:k})}}
    else if(s.sex==='f'&&s.age>=75&&s.hunger<0.6&&bad<0.15&&S.no3<60&&Math.random()<h/(24*18)*Math.max(0,1-n/60)){s.berried=rnd(22,28);logit('a female is carrying eggs');ev('berried',{id:s.id})}
  }
}
function doJob(k){
  if(k==='feed'){S.food+= (S.ration*0.5)*Math.max(1,S.shrimp.length/10)*0.6; ev('feed');logit('fed')}
  else if(k==='water'){S.nh3*=0.7;S.no2*=0.7;S.no3*=0.7;S.wc=(S.wc||[]).filter(function(d){return S.day-d<7});S.wc.push(S.day);ev('pour');logit('water changed, 30%')}
  else if(k==='filter'){S.clog=0;logit('filter cleaned')}
  else if(k==='moss'){S.moss=Math.min(1,S.moss+0.25);logit('moss added')}
  else if(k==='add'){for(var i=0;i<5;i++)S.shrimp.push(mkShrimp(rnd(60,120)));logit('5 shrimp added')}
}
function advance(hours){var guard=0;while(hours>0&&guard++<20000){var h=Math.min(1,hours);step(h);hours-=h}}
function job(k,delayH,say){S.jobs.push({at:S.h+delayH,k:k});save();speak(say)}
/* ---------- speech ---------- */
function speak(t,head){var e=$('st');if(e)e.textContent=t;}
function howText(){
  var n=S.shrimp.length, b=S.shrimp.filter(function(s){return s.berried>0}).length, babies=S.shrimp.filter(function(s){return s.age<30}).length;
  var a=[], w=[];
  if(n===0)a.push('No shrimp left.');
  else{a.push(n+(n===1?' shrimp':' shrimp')+(b?', '+(b===1?'one carrying eggs':b+' carrying eggs'):'')+(babies?', '+babies+' babies':'')+'.');}
  var hungry=S.shrimp.filter(function(s){return s.hunger>0.6}).length;
  var bad=S.nh3+S.no2*0.7;
  if(bad>0.5)w.push('The water is bad, change some today.');
  else if(bad>0.2)w.push('The water is off, change some.');
  else if(S.no3>60)w.push('The water is old, change some this week.');
  else if(S.no3>40)w.push('The water is getting old.');
  if(S.clog>0.8)w.push('The filter is slow, clean it.');
  if(n&&hungry>n/2)w.push('They are hungry.');
  else if(n&&S.food>1.5)w.push('There is food left on the floor, skip a day.');
  if(S.temp>28)w.push('It is warm in there.');
  if(!w.length)w.push(n?'They are fine.':'');
  return a.concat(w.slice(0,2)).join(' ');
}
/* ---------- audio ---------- */
function audio(){
  if(A)return A;
  var C=window.AudioContext||window.webkitAudioContext; if(!C)return null;
  var ctx=new C();
  A={ctx:ctx};
  A.master=ctx.createGain();A.master.gain.value=SOUND.master*vol;
  A.lp=ctx.createBiquadFilter();A.lp.type='lowpass';A.lp.frequency.value=SOUND.dull.clearHz;A.lp.Q.value=0.5;
  A.comp=ctx.createDynamicsCompressor();A.comp.threshold.value=-18;A.comp.ratio.value=4;
  A.lp.connect(A.comp);A.comp.connect(A.master);A.master.connect(ctx.destination);
  A.tank=ctx.createGain();A.tank.gain.value=1;A.tank.connect(A.lp);mixBuses(); /* everything the tank makes goes through here, one-sound buttons bypass it */
  // noise buffer
  var len=ctx.sampleRate*2, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
  A.noise=buf;
  // pink noise, 6 s, ends matched so the loop has no click
  var pl=ctx.sampleRate*6,pb=ctx.createBuffer(1,pl,ctx.sampleRate),pd=pb.getChannelData(0),b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(i=0;i<pl;i++){var w=Math.random()*2-1;b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.969*b2+w*0.153852;b3=0.8665*b3+w*0.3104856;b4=0.55*b4+w*0.5329522;b5=-0.7616*b5-w*0.016898;pd[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;b6=w*0.115926}
  var fadeN=ctx.sampleRate*0.5;for(i=0;i<fadeN;i++){var a=i/fadeN;pd[i]=pd[i]*a+pd[pl-fadeN+i]*(1-a)}
  pb=(function(){var nb=ctx.createBuffer(1,pl-fadeN,ctx.sampleRate);nb.getChannelData(0).set(pd.subarray(0,pl-fadeN));return nb})();
  A.pink=pb;
  // the filter: flow plus trickle, each breathing slowly
  var F=SOUND.flow;
  function loopSrc(){var x=ctx.createBufferSource();x.buffer=A.pink;x.loop=true;x.loopStart=0;x.loopEnd=A.pink.duration;return x}
  var fs=loopSrc(),fhp=ctx.createBiquadFilter(),flp=ctx.createBiquadFilter();fhp.type='highpass';fhp.frequency.value=F.lo;flp.type='lowpass';flp.frequency.value=F.hi;flp.Q.value=0.3;
  A.flowG=ctx.createGain();A.flowG.gain.value=0;var fl=ctx.createOscillator(),flg=ctx.createGain();fl.frequency.value=F.breathe;flg.gain.value=F.gain*F.depth;fl.connect(flg);flg.connect(A.flowG.gain);fl.start();
  fs.connect(fhp);fhp.connect(flp);flp.connect(A.flowG);A.flowG.connect(A.tank);fs.start(0,Math.random()*3);
  var T2=F.trickle,ts=loopSrc(),tb=ctx.createBiquadFilter();tb.type='bandpass';tb.frequency.value=T2.hz;tb.Q.value=T2.q;
  A.trickG=ctx.createGain();A.trickG.gain.value=0;var tl=ctx.createOscillator(),tlg=ctx.createGain();tl.frequency.value=T2.rate;tlg.gain.value=T2.gain*T2.depth;tl.connect(tlg);tlg.connect(A.trickG.gain);tl.start();
  var tl2=ctx.createOscillator(),tlg2=ctx.createGain();tl2.frequency.value=T2.rate*2.7;tlg2.gain.value=T2.gain*T2.depth*0.5;tl2.connect(tlg2);tlg2.connect(A.trickG.gain);tl2.start();
  ts.connect(tb);tb.connect(A.trickG);A.trickG.connect(A.tank);ts.start(0,1.5+Math.random()*3);
  /* a soft bed under the trickle and the bubbler: pink noise low-passed at 600 Hz */
  var bs=loopSrc(),blp=ctx.createBiquadFilter(),bhp=ctx.createBiquadFilter();blp.type='lowpass';blp.frequency.value=600;bhp.type='highpass';bhp.frequency.value=200;A.bedG=ctx.createGain();A.bedG.gain.value=0;bs.connect(bhp);bhp.connect(blp);blp.connect(A.bedG);A.bedG.connect(A.busT.drop.g);bs.start(0,Math.random()*4);
  /* the brook: noise through narrow bandpasses whose centre is pushed around by slow noise, the classic procedural water */
  A.brookG=ctx.createGain();A.brookG.gain.value=0;A.brookG.connect(A.busT.drop.g);A.brookBP=[];A.brookMod=[];
  SOUND.brook.voices.forEach(function(v){var src2=loopSrc(),bp2=ctx.createBiquadFilter();bp2.type='bandpass';bp2.frequency.value=v[0];bp2.Q.value=SOUND.brook.q;
    var mod=ctx.createBufferSource();mod.buffer=A.noise;mod.loop=true;var mlp=ctx.createBiquadFilter();mlp.type='lowpass';mlp.frequency.value=v[2];A.brookBP.push([bp2,v]);A.brookMod.push([mlp,v]);var mg=ctx.createGain();mg.gain.value=v[1]*6;mod.connect(mlp);mlp.connect(mg);mg.connect(bp2.frequency);
    var vg=ctx.createGain();vg.gain.value=1/SOUND.brook.voices.length;src2.connect(bp2);bp2.connect(vg);vg.connect(A.brookG);src2.start(0,Math.random()*4);mod.start(0,Math.random()*1.5)});
  A.roomG=ctx.createGain();
  // ammonia hiss
  var hs=ctx.createBufferSource();hs.buffer=buf;hs.loop=true;
  var hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=SOUND.hiss.hz;hp.Q.value=SOUND.hiss.q;
  A.hissG=ctx.createGain();A.hissG.gain.value=0;
  hs.connect(hp);hp.connect(A.hissG);A.hissG.connect(A.busT.hiss.g);hs.start();
  A.nextBubble=ctx.currentTime+0.3;
  A.voices={};

    else if(snd==='bell'){o.type='sine';o.frequency.value=hz;e.gain.setValueAtTime(0,at);e.gain.linearRampToValueAtTime(g*1.2,at+0.002);e.gain.exponentialRampToValueAtTime(0.0005,at+Math.max(dur,0.8));o.start(at);o.stop(at+Math.max(dur,0.8)+0.02);var o3=ctx.createOscillator(),e3=ctx.createGain();o3.frequency.value=hz*2.0;e3.gain.setValueAtTime(0,at);e3.gain.linearRampToValueAtTime(g*0.5,at+0.002);e3.gain.exponentialRampToValueAtTime(0.0005,at+0.5);o3.connect(e3);e3.connect(out);o3.start(at);o3.stop(at+0.52)}
    else if(snd==='knock'){o.disconnect();var n=Math.max(1,Math.round(dur/0.2));for(var i=0;i<n;i++){var ok=ctx.createOscillator(),ek=ctx.createGain(),tk=at+i*dur/n;ok.type='triangle';ok.frequency.setValueAtTime(hz,tk);ok.frequency.exponentialRampToValueAtTime(hz*0.8,tk+0.06);ek.gain.setValueAtTime(0,tk);ek.gain.linearRampToValueAtTime(g*1.5,tk+0.003);ek.gain.exponentialRampToValueAtTime(0.0005,tk+0.07);ok.connect(ek);ek.connect(out);ok.start(tk);ok.stop(tk+0.09)}}}
  /* play the picture: only one type when solo is given */
  function picPlay(solo){if(!audio())return;picStop();var ctx=A.ctx,P=SOUND.pic,G=picGrid(),C=PICS.cols,R=PICS.rows,dur=PICS.secs/C,t=ctx.currentTime+0.12,run={osc:[],timers:[],nodes:[]},end=t+PICS.secs;PICRUN=run;soloT=end+0.6;tankLevel();
    var bus=ctx.createGain();bus.gain.value=1;bus.connect(A.lp);run.nodes.push(bus);
    PIC_TYPES.forEach(function(T){var k=T[0],st=PICS.types[k];if(!st||st.snd==='off'||(solo&&solo!==k))return;var tg=ctx.createGain();tg.gain.value=st.vol;tg.connect(bus);run.nodes.push(tg);
      for(var r=0;r<R;r++){var hz=PICS.lo*Math.pow(PICS.hi/PICS.lo,R>1?(R-1-r)/(R-1):0.5)*st.oct;if(hz>9000)continue;
        if(st.snd==='sine'||st.snd==='tri'||st.snd==='square'||st.snd==='hum'){var o=ctx.createOscillator(),g=ctx.createGain(),out=g;o.type=st.snd==='tri'?'triangle':st.snd==='square'?'square':'sine';o.frequency.value=hz;
            if(st.snd==='square'){var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(8000,hz*3);g.connect(lp);lp.connect(tg);run.nodes.push(lp)}else g.connect(tg);
            if(st.snd==='hum'){var v=ctx.createOscillator(),vg=ctx.createGain();v.frequency.value=5+r%3;vg.gain.value=hz*0.012;v.connect(vg);vg.connect(o.frequency);v.start(t);v.stop(end+0.3);run.osc.push([v,vg])}
            g.gain.value=0;o.connect(g);o.start(t);o.stop(end+0.3);run.osc.push([o,g]);var any=false;
            for(var c=0;c<C;c++){var val=G[k][c][r];g.gain.setTargetAtTime(val*P.gain,t+c*dur,0.015);if(val>0)any=true}g.gain.setTargetAtTime(0,end,0.03);if(!any){try{o.stop()}catch(e){}}}
        else{for(var c2=0;c2<C;c2++){var v2=G[k][c2][r];if(v2>0.002)picHit(st.snd,hz,v2*P.gain,t+c2*dur,dur,tg)}}}});
    for(var c3=0;c3<C;c3++){if(PICS.tick){DEMO=true;tone(2400,12,P.tick,t+c3*dur,'sine');DEMO=false}(function(c){run.timers.push(setTimeout(function(){0},Math.max(0,(t+c*dur-ctx.currentTime)*1000)))})(c3)}
    run.timers.push(setTimeout(function(){if(PICRUN===run){PICRUN=null;0}},(PICS.secs+0.4)*1000))}
  function demoKey(k){if(!audio())return;var t=A.ctx.currentTime+0.05;
    if(k==='drop'||k==='plop'||k==='hiss'){soloT=0;A.quietUntil=A.ctx.currentTime+5;tankLevel();if(k==='hiss'){var hs=A.ctx.createBufferSource();hs.buffer=A.noise;hs.loop=true;var hp=A.ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=SOUND.hiss.hz;hp.Q.value=SOUND.hiss.q;var hg=A.ctx.createGain();hg.gain.setValueAtTime(0,t);hg.gain.linearRampToValueAtTime(SOUND.hiss.max*0.6,t+0.6);hg.gain.setValueAtTime(SOUND.hiss.max*0.6,t+3);hg.gain.linearRampToValueAtTime(0,t+3.6);hs.connect(hp);hp.connect(hg);hg.connect(A.busD.hiss.g);hs.start(t);hs.stop(t+3.7)}return}
    soloT=t+3.5;tankLevel();DEMO=true;
    var fake={eatA:200,eatJ:50,eatB:10,idle:200,swimS:200,swimL:200,eggs:200};
    if(k==='eatA'||k==='eatJ'||k==='eatB'){eatSound({id:950,age:fake[k],hunger:0.2,berried:0,rate:1},t,true);eatSound({id:950,age:fake[k],hunger:0.2,berried:0,rate:1},t+0.9,true)}
    else if(k==='eggs')eatSound({id:951,age:200,hunger:0.2,berried:10,rate:1},t,true);
    else if(k==='idle'){idleSound({id:952,age:200},t,1);idleSound({id:952,age:200},t+0.7,1)}
    else if(k==='swimS'||k==='swimL'){swimSound({id:953,age:200},t,k==='swimL'?'long':'short');swimSound({id:953,age:200},t+1.3,k==='swimL'?'long':'short')}
    else if(k==='beep'){for(var i=0;i<4;i++)beepAt(SOUND.pulse.hzGood,t+i*1.2/sp('beep'),SOUND.pulse.gain,0)}
    else{var seen=S?S.seen:null;if(S)S.seen=Object.assign({},S.seen,{molt:1,moltfail:1,babies:1,death:1,feed:1,pour:1});var cl=cluster,ek={deathA:['death',{age:200}],deathB:['death',{age:5}],eggs:['berried',{}]}[k]||[k,{}];playEv({k:ek[0],d:ek[1]});cluster=cl;if(S)S.seen=seen}
    DEMO=false}
/* ---------- the game's ear tank (Pass 257) ----------
   A clean 5-shrimp tank, 3 females, the default decor, a cycled filter. A day in 5 seconds, its own clock, only while this page shows.
   Feed, Change water (it rinses the filter too), Hear the tank. The ? lists every sound to tap. */
var DAY_S=5;
function post(m){try{m.ear=1;parent.postMessage(m,'*')}catch(e){}}
function fresh(){newState([2,0,1,0,3,0,0,1,4,0,0,3],5,'');S.no3=0;S.shrimp.forEach(function(x,i){x.sex=i<3?'f':'m';x.age=rnd(90,200)});S.food=0.3;S.taught=true;save();if(A)A.voices={};evq=[]}
var SOUNDS=[['drop','The filter','An air stone. It runs all the time, softer when it needs a rinse.'],['beep','Monitor beep','Slow when the water is clean, faster as it gets dirty. Fast means change water.'],['hiss','Hiss','Ammonia, from food rotting. Feed less and change water.'],
 ['eatA','Adult eating','A grown shrimp picking at food.'],['eatJ','Young eating','The same, smaller and higher.'],['eatB','Baby eating','Tiny and very high.'],['idle','Sitting still','A faint flick, a shrimp resting.'],
 ['swimS','Swim, short','A quick dart.'],['swimL','Swim, long','A long swim, there are more right after you feed.'],['eggs','Eggs','A female carrying eggs.'],['molt','Molt','A shrimp leaves its old shell. Normal.'],
 ['moltfail','Failed molt','It got stuck. Too many water changes in a week, or bad water.'],['babies','Babies hatch','New babies.'],['deathB','Baby death','A baby died. Some always do.'],['deathA','Adult death','An adult died, old age or bad water.'],
 ['feed','Feeding','Food going in.'],['pour','Water change','A third of the water out, new water in.'],['p:wood','Wood','From Hear the tank, the driftwood. A low bell.'],['p:stone','Stones','From Hear the tank, the rocks. Buzzy.'],['p:plant','Plants','From Hear the tank, the plants. A high hum.']];
function helpHTML(){return SOUNDS.map(function(s){return '<button class="snd" data-k="'+s[0]+'"><b>'+s[1]+'</b><span>'+s[2]+'</span></button>'}).join('')}
function wake(){var a=audio();if(!a)return null;if(a.ctx.state!=='running')a.ctx.resume();return a}
function hear(k){if(!wake())return;if(k.indexOf('p:')===0)picPlay(k.slice(2));else demoKey(k)}
function line(){if(!S)return;var n=S.shrimp.length;if(n===0){fresh();n=S.shrimp.length;speak('The tank crashed. The shop started it again, 5 shrimp in clean water.');} /* Pass 258: the shop restarts it */$('day').textContent='Day '+(Math.floor(S.day)+1)+', '+n+(n===1?' shrimp':' shrimp');$('again').hidden=n>0}
function start(){
 if(!load())fresh();S.last=Date.now();lastReal=Date.now();line();
 $('help-list').innerHTML=helpHTML();
 document.body.addEventListener('pointerdown',wake);document.body.addEventListener('keydown',wake);
 $('b-play').onclick=function(){setTank(!TANK);speak(TANK?'Playing.':'Paused.')};
 $('b-feed').onclick=function(){wake();if(!TANK)setTank(true);doJob('feed');save();speak('Fed.');post({type:'care',k:'feed'})};
 $('b-water').onclick=function(){wake();if(!TANK)setTank(true);doJob('water');S.clog=0;save();speak('A third of the water changed, and the filter rinsed.');post({type:'care',k:'water'})};
 $('b-hear').onclick=function(){if(!wake())return;picPlay(null);speak('Left to right: wood is the bell, stones buzz, plants hum. High is the top of the tank.')};
 $('b-help').onclick=function(){var h=$('help'),on=h.hidden;h.hidden=!on;this.setAttribute('aria-expanded',on)};
 $('b-back').onclick=function(){save();if(A)A.ctx.suspend();post({type:'back'})};
 $('again').onclick=function(){fresh();line();speak('A new tank, 5 shrimp.')};
 $('help-list').onclick=function(e){var b=e.target.closest('[data-k]');if(b)hear(b.dataset.k)};
 setInterval(function(){if(document.hidden||PAUSED){lastReal=Date.now();return}var now=Date.now(),dt=(now-lastReal)/1000;lastReal=now;if(dt<0||dt>5)dt=0.25;advance(dt*24/DAY_S);line();if(Math.random()<0.05)save()},250);
 setInterval(sched,100);
 document.addEventListener('visibilitychange',function(){if(document.hidden){if(A)A.ctx.suspend();if(S)save()}else{lastReal=Date.now();if(A&&!PAUSED)A.ctx.resume()}});
 window.addEventListener('message',function(e){var d=e.data;if(!d||!d.game)return;if(d.type==='vis'){PAUSED=!d.on;lastReal=Date.now();if(A){if(d.on)A.ctx.resume();else A.ctx.suspend()}if(!d.on&&S)save()}});
 post({type:'ready'});
}
start();
