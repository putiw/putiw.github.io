<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The ship</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#04050a;--ink:#e8e6df;--dim:#8a8c99;--line:#262a38;--card:#0d0f18;--acc:#ff6b4a;--ok:#9fe0a8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow:hidden;-webkit-text-size-adjust:100%}
#sky{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:manipulation}
#top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(#04050aee,#04050a00);z-index:3}
#top button{font:inherit}
.back{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
#fuel{font-variant-numeric:tabular-nums;white-space:nowrap}
#wish{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.chip{font-size:12px;border:1px solid var(--line);border-radius:10px;padding:1px 7px;color:var(--dim);white-space:nowrap}
#panel{position:fixed;left:0;right:0;bottom:0;max-height:52vh;overflow:auto;background:var(--card);border-top:1px solid var(--line);padding:12px 14px;padding-bottom:max(14px,env(safe-area-inset-bottom));z-index:2}
#panel.tall{max-height:100%;top:0;padding-top:calc(56px + env(safe-area-inset-top));border-top:0}#top.solid{background:#0d0f18}
#panel h2{font-size:17px;margin:0}
#panel h3{font-size:13px;margin:12px 0 4px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
#panel p{margin:6px 0}
.sub{color:var(--dim);font-size:13px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.facts{margin:6px 0;padding:0;list-style:none}
.facts li{margin:2px 0;display:grid;grid-template-columns:70px 1fr;gap:4px}
.facts b{color:var(--dim);font-weight:500}
.known{border-left:2px solid var(--line);padding-left:8px;color:#c9c7bf;font-size:14px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.btn{font:inherit;background:#1a1e2c;color:var(--ink);border:1px solid #343a50;border-radius:8px;padding:7px 11px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.go{background:var(--acc);border-color:var(--acc);color:#140804;font-weight:600}
.btn.sure{background:#ffd34a;border-color:#ffd34a;color:#140804}
.wl{margin:8px 0 4px;padding-left:20px}
.wl li{margin:4px 0}
#rank{width:100%;height:180px;display:block;margin:6px 0}
.ttl{font-weight:600;margin:10px 0 0}
.prep{font-weight:600;margin:12px 0 0;color:var(--dim)}
/* Pass 174: the panel keeps one height, every instrument has its own row, Fly by sits next to the star, Brake on the map */
#panel:not(.tall){height:404px;max-height:none;overflow:hidden;padding-top:10px}
#panel:not(.tall) .hd{height:24px;overflow:hidden}
.known{height:3.9em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;font-size:13px;line-height:1.3;margin:6px 0;cursor:pointer}
#panel:not(.tall) .facts{margin:4px 0 0}
.facts li{height:35px;margin:0;align-items:center;grid-template-columns:84px 1fr;font-size:13px;line-height:1.25;overflow:hidden}
/* one line each, swipe sideways to read the rest (Puti, 31 Oct) */
.facts li>span.v{white-space:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:6px 0;mask-image:linear-gradient(90deg,#000 88%,transparent)}
.facts li>span.v::-webkit-scrollbar{display:none}
#kfull{position:fixed;left:12px;right:12px;z-index:4;background:#0d0f18f2;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;color:#c9c7bf}
.facts .scan{font:inherit;font-size:13px;background:#1a1e2c;color:var(--ink);border:1px solid #343a50;border-radius:7px;padding:4px 9px;cursor:pointer;justify-self:start}
.facts .scan:disabled{opacity:.4;cursor:default}
.facts .off{color:#5b5e6c;font-size:13px}
#ahead{position:fixed;z-index:3;background:#0d0f18ee;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12.5px;line-height:1.3;width:max-content;max-width:210px;transform:translate(-50%,calc(-100% - 16px))}
#ahead b{display:block;font-size:13.5px}#ahead .btn{margin-top:6px;padding:5px 10px;font-size:13px}
#brakeb{position:fixed;right:12px;z-index:3;font-size:13px;padding:6px 10px}
</style>
</head>
